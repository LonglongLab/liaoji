  /api/v1/sync/jobs:
    post:
      operationId: createSyncJob
      description: >-
        一个按钮跑完四段上传：正文 → 缩略图 → 头像 → 原图（PSU-2.70）。
        进度、暂停、取消、事件流全部走既有的 `/api/v1/jobs/*`。
