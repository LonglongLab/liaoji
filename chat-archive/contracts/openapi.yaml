openapi: 3.1.0
info:
  title: 聊记本地 API
  version: 0.0.1
paths:
  /api/v1/remote/backup/config/policy:
    x-chat-archive-deployments: [remote]
    put:
      operationId: updateBrowserBackupPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserBackupPolicy" }
      responses:
        "200":
          description: 仅在目标完全不变时复用服务器保存的凭据，验证通过后更新策略
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/management/verify:
    x-chat-archive-deployments: [remote]
    post:
      operationId: confirmBrowserManagement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserManagementProof" }
      responses:
        "200":
          description: 本会话短期管理确认；不返回任何凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserManagementConfirmation" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/disable:
    # 单独成一条路径而不是 DELETE /remote/backup/config：端归属标记落在**路径**上，
    # 而 /remote/backup/config 两端都实现读写，停用只有自托管浏览器管理才有。
    x-chat-archive-deployments: [remote]
    post:
      operationId: disableBrowserBackup
      description: 仅自托管浏览器管理可用；停用后续轮次并忘记凭据，保留账本和云端对象
      responses:
        "200":
          description: 已停用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/use-object-storage:
    x-chat-archive-deployments: [remote]
    post:
      operationId: useAttachmentStorageForBackup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedBackupRequest" }
      responses:
        "200":
          description: 复用服务器保存的目标，凭据不发回浏览器；测试通过后启用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        "200":
          description: 启动摘要（脱敏）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/capabilities:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: 本端类型与各项能力的当前状态；远程端未认证时只给端类型与认证状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentCapabilities" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/status:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteArchiveStatus
      responses:
        "200":
          description: 本机受保护凭据中是否存在可用远程档案；不触发远程请求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteArchiveStatus" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/web/open:
    x-chat-archive-deployments: [local]
    post:
      operationId: openRemoteWeb
      description: 仅从本机已绑定配置读取地址，探测远端网页版并用系统浏览器打开；不接受目标 URL、不传递设备令牌。
      responses:
        "200":
          description: 浏览器启动结果；opened 仅表示系统接受了打开请求，不证明远端已登录。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [opened, not_configured, invalid_address, unsupported, unavailable, browser_unavailable]
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/pairing-codes:
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: issuePairingCode
      description: >-
        用本机已存的设备凭据向远端要一个一次性配对码，交给下一台采集机
        （PSU-2.68）。远端没有「本机凭据」这回事，所以只在采集端存在。
        本机还没接入时答 `REMOTE_NOT_CONFIGURED`。
      responses:
        "200":
          description: 已签发的配对码与它的到期时刻
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedPairingCode" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/pairing:
    x-chat-archive-deployments: [local]
    post:
      operationId: redeemPairingCode
      description: >-
        把另一台机器签发的配对码兑换成本机自己的设备身份，凭据写入本机受保护
        存储（Windows 上是 DPAPI）。响应**不含令牌**——界面没有任何理由拿到它。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingRequest" }
      responses:
        "200":
          description: 本机已获得自己的设备身份
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairedDevice" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/config:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteBackupConfig
      responses:
        "200":
          description: 当前备份目标与策略摘要；永不返回完整凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateRemoteBackupConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupConfigUpdate" }
      responses:
        "200":
          description: 已完成真实往返验证并保存；响应不含完整凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupConfig" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/config/test:
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: testRemoteBackupConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupConfigUpdate" }
      responses:
        "200":
          description: 探针对象真往返验证结果；不返回对象键、URL 或 provider 原始错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerification" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/runs:
    # 两端都实现：这是**只读**的近况，浏览器会话看得见它。配置那一半只在本机端——
    # 填凭据是已配对设备的事（object-storage 的配置在浏览器这端一条都没有，
    # 同一条裁定）。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: listRemoteBackupRuns
      responses:
        "200":
          description: 备份近况与最近若干次运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRunList" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/run-now:
    # 与 GET /runs 分成两条路径，是因为端归属标记落在**路径**上而不是方法上，
    # 而这两件事的归属不同。远端那份契约里它就是 POST /runs。
    # 自托管浏览器管理（PSU-2.219）也能立即备份，所以两端都实现。
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: requestRemoteBackupRun
      responses:
        "202":
          description: >-
            已排队。**不是完成**：真正的一轮由远端后台线程跑，可能要几分钟，
            客户端应当轮询 GET /runs。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRunList" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/backup/latest:
    x-chat-archive-deployments: [local]
    get:
      operationId: getLatestRemoteBackup
      summary: >-
        最新一份完整备份的清单与各段短命只读链接，用于把它拉到本机。
        **手动的一步**，不是自动的第三份副本。
      responses:
        "200":
          description: 清单 + 每段一条签名 URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDownload" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/object-storage/config:
    get:
      operationId: getObjectStorageConfig
      responses:
        "200":
          description: 当前腾讯云 COS 配置摘要；永不返回完整凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectStorageConfig" }
        "401": { $ref: "#/components/responses/ObjectStorageUnauthorized" }
        "404": { $ref: "#/components/responses/ObjectStorageArchiveNotFound" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: updateObjectStorageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectStorageConfigUpdate" }
      responses:
        "200":
          description: 已完成真实往返验证并原子切换对象存储；响应不含完整凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectStorageConfig" }
        "400": { $ref: "#/components/responses/ObjectStorageConfigurationInvalid" }
        "422": { $ref: "#/components/responses/ObjectStorageVerificationFailed" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/remote/object-storage/config/test:
    post:
      operationId: testObjectStorageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectStorageConfigUpdate" }
      responses:
        "200":
          description: 合成对象真实往返验证结果；不返回对象键、URL 或 provider 原始错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectStorageVerification" }
        "400": { $ref: "#/components/responses/ObjectStorageConfigurationInvalid" }
        "422": { $ref: "#/components/responses/ObjectStorageVerificationFailed" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/remote/object-storage/config/restore:
    post:
      operationId: restoreObjectStorageGeneration
      summary: 切回某一代已保存的对象存储配置，使该代附件重新可读
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectStorageGenerationRestore" }
      responses:
        "200":
          description: 已验证并切回该代配置；响应不含完整凭据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectStorageConfig" }
        "409": { $ref: "#/components/responses/ObjectStorageGenerationMismatch" }
        "422": { $ref: "#/components/responses/ObjectStorageVerificationFailed" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: 版本化非敏感设置；更新检查默认关闭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdateRequest" }
      responses:
        "200":
          description: 已原子保存并执行新媒体缓存配额
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/auto-sync:
    get:
      operationId: getAutoSync
      responses:
        "200":
          description: 自动同步的开关、间隔与当前这一轮；本机独有能力
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSyncStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: updateAutoSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoSyncUpdateRequest" }
      responses:
        "200":
          description: 已保存并重算下一轮；从关到开或熔断后再开会清掉熔断
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoSyncStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/transcription:
    put:
      operationId: updateTranscriptionSettings
      description: >-
        The two transcription switches live on their own resource for the same
        reason auto-sync does: SettingsUpdateRequest is a whole-body replacement
        and five callers pass its three values positionally. Widening it would
        make a theme change able to silently turn transcription on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/TranscriptionSettingsUpdateRequest" }
      responses:
        "200":
          description: 已保存。总开关关着时 auto_new 仍然照原样存着，没有意义而已
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
        "409":
          description: >-
            还没有腾讯云密钥（TRANSCRIPTION_NOT_CONFIGURED）。**服务端也拦这一道**，
            不只靠界面把开关置灰：开着而转不了是最糟的一种状态——看着一切正常，
            一条也转不出来，而且什么都不说。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/transcription/credentials:
    get:
      operationId: getTranscriptionCredentials
      description: >-
        存了什么，**除了密钥本身**。界面靠它回答唯一的那个问题：
        「现在这把，是不是我以为的那把」。
      responses:
        "200":
          description: 当前凭据的非敏感描述
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptionCredentials" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    put:
      operationId: putTranscriptionCredentials
      description: >-
        **先验后存，一个动作**，与对象存储那条同一条规矩：存不下能用的配置，
        就别让它变成已保存的那一个。验证拿一个不存在的任务号问一次查询接口——
        不建任务、不上传录音、不计费。
        它验得出密钥能签名，验**不出**这个账号开通了录音识别（那要真建一次
        任务，要花钱），所以成功的措辞只能说到「密钥对」为止。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/TranscriptionCredentialsRequest" }
      responses:
        "200":
          description: 已验证并保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptionCredentials" }
        "400":
          description: >-
            腾讯云拒绝了这把密钥（TRANSCRIPTION_CREDENTIALS_REJECTED）。
            `message` 是厂商的稳定代号（`AuthFailure.SignatureFailure` /
            `AuthFailure.SecretIdNotFound` / `NETWORK_UNAVAILABLE`），
            界面据此分辨该说哪一句；厂商的**原文**一个字都不出现——
            里面有请求 id 与账号信息。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteTranscriptionCredentials
      description: >-
        删掉密钥，并且**把转写一起关掉**。留一个开着却没有密钥的开关，
        正是上面那道闸要拦的状态；删钥匙的人想要的是「别再往外发录音了」。
      responses:
        "200":
          description: 已删除；答复是删完之后的状态（configured 为 false）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranscriptionCredentials" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/status:
    get:
      operationId: getUpdateStatus
      responses:
        "200":
          description: 签名更新状态；不返回分发 URL、公钥或本地路径
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/check:
    post:
      operationId: checkForUpdates
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCheckRequest" }
      responses:
        "200":
          description: 不带请求体或 trigger=manual 时同步获取并验证 Ed25519 签名清单；自动触发（startup/focus/visible/online）只投递到本机协调器、由后端再核开关与冷却，立即返回当前状态（PSU-2.222）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/postpone:
    post:
      operationId: postponeUpdateReminder
      description: 本机专用；同版本暂缓最长24小时，网页与托盘共用。until为迁移既有期限的可选Unix毫秒时间，不延长既有客户端期限。不触发检查、下载或安装。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePostponeRequest" }
      responses:
        "200":
          description: 已持久化暂缓，返回当前更新及提醒状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/apply:
    post:
      operationId: applyUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplyRequest" }
      responses:
        "200":
          description: 已验证包摘要与安全结构并切换活动版本指针；重启后生效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/install-now:
    post:
      operationId: installUpdateNow
      description: >-
        「重启并安装」（PSU-2.173）。只接受已经下载并验证、正等着退出时安装的那一版
        （`version` 必须等于它），不下载任何东西。接受后桌面外壳在回应发出之后退出，
        退出路径把安装器交给包外的脚本，安装器以带进度的小窗运行。
        进程没有可关的窗口（CLI serve、退回浏览器）时回 UPDATE_RESTART_UNAVAILABLE；
        有导入或同步在跑、用户在确认框里拒绝时回 UPDATE_RESTART_DECLINED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplyRequest" }
      responses:
        "200":
          description: 已安排退出；答复是退出前那一刻的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/updates/rollback:
    post:
      operationId: rollbackUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRollbackRequest" }
      responses:
        "200":
          description: 切换回上一活动版本；重启后生效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/feedback:
    x-chat-archive-deployments: [local]
    post:
      operationId: submitFeedback
      description: >-
        把用户填写的一条反馈转交给外部反馈平台。**只有本地端有这条**：打包形态的
        SPA 其 CSP 是 `connect-src 'self'`，页面本身连不到第三方域名；而本仓的
        惯例本来也是外网请求由后端出（更新检查、远程登录都如此）。远程端不实现
        它，也不认领 `feedback` 能力——记为 profile 差异，见
        docs/local-remote-boundary.md 第 3 节。
        请求体里**没有** `project_id`：项目标识是这台机器的配置，由后端注入，
        界面无从指定也不该指定。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackSubmission" }
      responses:
        "200":
          description: 上游已收下这条反馈；`owner_url` 是提交者自己回看这条反馈的链接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "400": { $ref: "#/components/responses/FeedbackUpstreamRejected" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/feedback/widget-config:
    x-chat-archive-deployments: [local]
    get:
      operationId: getFeedbackWidgetConfig
      description: >-
        反馈 widget 的平台侧配置，**同源转发**。只有本地端有这条，理由与
        `/api/v1/feedback` 逐字相同：打包形态 SPA 的 CSP 是 `connect-src 'self'`，
        页面连不到平台域名，所以 widget 的 `configUrl` 指的是这条路径。
        **没有参数**：`projectId` 是这台机器的配置、由后端注入。widget 的取数口
        会带一个 `?projectId=…`，后端不看它——页面能指定项目标识，就等于页面上
        任何一段脚本都能拉到别的项目的脱敏规则。
        **这条端点不出网等待**：它只答手上缓存着的那一份，刷新在后台跑。平台的
        `loadWidgetConfig` 既没有超时也没有 AbortSignal，而 widget 在渲染对话框
        之前就 await 它——这里等多久，用户点「反馈」之后就对着一个不动的界面等
        多久，而这台机器离线是常态。
      responses:
        "200":
          description: >-
            平台下发的那份配置，**原样转发不解释**（形状由平台的
            `serializeFeedbackWidgetConfig` 定：`projectId`、`widgetVersion`、
            `limits`、`privacy`）。本仓不把它写成固定字段：解释它的是 widget 的
            `resolveWidgetConfig`，在这里再写一份只会多一处会与平台漂移的判断，
            而漂移的症状是「这台机器跑的脱敏规则和平台那张表不一样」。
            响应带 `Cache-Control: no-store`：脱敏规则是「平台改一次、刷新即生效」
            的那一半。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackWidgetConfig" }
        "503":
          description: >-
            现在没有平台配置可给（还没暖起来、或者这台机器离线）。
            **不是错误态**：widget 收到任何非 2xx 都退回它自己的内置保守值，而在
            这条通道上那是日常路径而不是降级路径。答 503 而不是 200 加一个空壳，
            是为了让 widget 如实把配置来源记成 `built-in`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/feedback/issues/{issue_key}/contact:
    x-chat-archive-deployments: [local]
    put:
      operationId: saveFeedbackContact
      description: >-
        回执页补联系方式（平台 `SCN-FWB-136`），**同源转发**到平台的
        `PUT /api/feedback/issues/{key}/contact`。只有本地端有这条，理由与
        `/api/v1/feedback` 相同：打包形态 SPA 的 CSP 是 `connect-src 'self'`。
        widget 的 `contactUrl` 是 `/api/v1/feedback/issues` 这个前缀。
        `Authorization: Bearer <owner capability>` **原样**转给平台（capability
        取自提交回执 `owner_url` 的 hash）。**平台的状态码原样透传、不走本仓的错误
        信封**：widget 要从 400 里认出 `FEEDBACK_PRIVACY_REJECTED`（重试不会成功），
        收敛成一个本机码它就只能说「可以重试」。响应体只放行平台文档写明的键。
        本机自己的失败（key 不合形状、请求体离谱、连不上平台）仍走 `Error` 信封。
      parameters:
        - name: issue_key
          in: path
          required: true
          description: >-
            平台的 Issue id（今天是 `feedback:<毫秒>:<随机串>`）。首字符必须是字母数字，
            其余只许 `[A-Za-z0-9_.:-]`——这条代理只能到达 `<前缀>/<一段>/contact`
            这一个形状。
          schema: { type: string, minLength: 1, maxLength: 192, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$" }
        - name: Authorization
          in: header
          required: false
          description: "`Bearer <owner capability>`，原样转发；缺席时由平台答 401。"
          schema: { type: string }
      requestBody:
        required: true
        description: 原样转发给平台，本机不解析（空值与超长由平台答 400）。
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackContactRequest" }
      responses:
        "200":
          description: 存上了。平台**不回显**联系方式。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackContactAnswer" }
        "400":
          description: >-
            平台拒收（`FEEDBACK_CONTACT_EMPTY` / `FEEDBACK_CONTACT_TOO_LONG` /
            `FEEDBACK_PRIVACY_REJECTED` + `patterns`），或本机判定 key 不合形状
            （`QUERY_INVALID`，`Error` 信封）。
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FeedbackContactAnswer" }
                  - { $ref: "#/components/schemas/Error" }
        "401":
          description: >-
            平台答的 `{error: "Unauthorized"}`（capability 缺席/无效/过期/属于别的
            Issue），或本机 `X-Archive-Token` 校验没过（`Error` 信封）。
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FeedbackContactAnswer" }
                  - { $ref: "#/components/schemas/Error" }
        default:
          description: 平台的其它答复（原样透传），或本机的结构化错误。
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FeedbackContactAnswer" }
                  - { $ref: "#/components/schemas/Error" }
  /api/v1/remote/accounts:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: listRemoteArchiveAccounts
      responses:
        "200":
          description: >-
            远程归档的账号维度（记录模型 v3，PSU-2.35a）：有哪些上传流（账号）、
            各占多少行、多少行未归属。远端不到 v3 时答 QUERY_INVALID——界面按
            `record_model_version` 决定要不要问，问不到就保持无切换器的现状。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteAccountsPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/conversations:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: listRemoteConversations
      parameters:
        - { $ref: "#/components/parameters/RemoteCursor" }
        - { $ref: "#/components/parameters/RemoteConversationFilter" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: >-
            远程会话稳定分页；名称未上传时 display_name 为 null。v4 远端按最近
            活跃倒序（与本机会话列表同一条排序），更早的远端按 conversation_id
            ——两种都由 cursor 走，形状不变，客户端不必知道走的是哪一条
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteConversationPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/conversations/{conversation_id}:
    # 一条会话的身份，不必先在列表里把它翻出来（记录模型 v6，PSU-2.44）。
    # 没有这个端点时，标题取决于读者恰好加载过哪几页：一改过滤词就是另一份
    # 缓存，正在读的那条会话当场退化成不透明标识。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteConversation
      parameters:
        - { $ref: "#/components/parameters/RemoteConversationId" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
      responses:
        "200":
          description: >-
            一条远程会话，形状与列表行**逐字段相同**——读的人不该分得出标题
            来自列表还是来自这里。远端到不了 v6 时答 QUERY_INVALID（不回退成
            「自己去列表里找」）；这个归档（或所指账号）下没有这条会话时答
            NOT_FOUND，而不是编一条空会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteConversationSummary" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/conversations/{conversation_id}/members:
    # 群成员名单（记录模型 v8，PSU-2.47）。远端到不了 v8 时答 QUERY_INVALID
    # 而**不是空名单**：空名单是一句断言（「这个群没有别人」），而实情是
    # 「这一端还没有名单这回事」。两句话混掉就再也分不开。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: listRemoteConversationMembers
      parameters:
        - { $ref: "#/components/parameters/RemoteConversationId" }
        - { $ref: "#/components/parameters/RemoteCursor" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: >-
            一页群成员，按成员标识稳定分页。空的 items 是真实答案（这条会话的
            名单还没发布过），不是「不支持」——不支持在这条路上是 QUERY_INVALID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteConversationMembersPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/conversations/{conversation_id}/messages:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: listRemoteConversationMessages
      parameters:
        - { $ref: "#/components/parameters/RemoteConversationId" }
        - { $ref: "#/components/parameters/RemoteCursor" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: 远程消息稳定分页；渲染字段未上传时为 null，不含成员名单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteMessagePage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/conversations/{conversation_id}/messages/window:
    # 定位到某条记录的上下文（记录模型 v9，PSU-2.48）。形状与本机
    # `/api/v1/conversations/{id}/messages/window` 逐字相同，所以同一个前端
    # 组合式（`useMessageAnchor`）两端通用，不为「这是哪一端」写第二段映射。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteMessageWindow
      parameters:
        - { $ref: "#/components/parameters/RemoteConversationId" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
        - name: anchor_message_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: before
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 20 }
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 200, default: 20 }
      responses:
        "200":
          description: >-
            锚点前后的一段，锚点自己在其中，按阅读顺序升序。没有游标——续读是
            拿边上那一条当新锚点再问一次。只有报到 `record_model_version >= 9`
            的远端答得出；更早的远端答 REMOTE_RECORD_MODEL_TOO_OLD，
            **不退回一页最新的**：读者点的是「定位到上下文」，把别处的一屏
            交给他，他会以为那就是命中所在。锚点不在这条会话里则 404。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteMessageWindow" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/attachments/{blob_id}/url:
    # 两端都实现，而且是**同一段映射**（`RemoteArchiveFacade.attachment_url`）。
    # 少标一端，前端就得为那一端另写一条取附件的路——「同一份前端零改动可用」
    # 到此为止。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteAttachmentUrl
      parameters:
        - name: blob_id
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
      responses:
        "200":
          description: >-
            附件的短时直取 URL。**字节不经过任何 API 进程**：页面拿这个 URL
            自己去对象存储取（`docs/local-remote-boundary.md` 第 4 节）。
            只有已完成远程校验（remote_ready）的附件签得出来；仍在上传的附件
            答 404。

            2.43 起这条 404 **不再意味着「读的人分不清还没传上来和丢了」**：
            它与 `…/thumbnail-url` 合起来才是完整答案——两条都 404 是「还没传
            上来」，这条 404 而那条 200 是「原图不在归档里，只有缩略图」。
            单看这一条仍然分不清，所以前端必须两条都问。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteAttachmentUrl" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/attachments/{blob_id}/thumbnail-url:
    # 与上面那条同一段映射（`RemoteArchiveFacade`），少标一端前端就得为那一端
    # 另写一条取缩略图的路。
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: getRemoteAttachmentThumbnailUrl
      parameters:
        - name: blob_id
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
          description: >-
            **主工件**的标识，就是 `attachment_refs` 里那一个。缩略图自己的标识
            由服务端派生（`sha256("blob-thumb||" + blob_id)`），不走线也不进记录：
            两端各自算得出来，所以记录 wire 格式一个字节都不用改。
      responses:
        "200":
          description: >-
            缩略图的短时直取 URL，外加一句「原图在不在」。没有缩略图答 404
            `THUMBNAIL_UNAVAILABLE`，与本机
            `/api/v1/attachments/{id}/thumbnail` 同一个错误码，于是前端的回退
            是一条路而不是两条。**归档整个不存在时这条也答同一个码**——它问的
            就是「有没有这份工件」，而那种情况会话列表与消息页早就先报出来了，
            这里不是诊断它的地方。

            `original_available` 让页面**在画气泡的那一次请求里**就知道该不该
            标「仅缩略图」，不多一次往返。真机上有 39,017 张图的原图早被本机
            配额淘汰、从未上行，缩略图是仅剩的字节——不说清楚就等于让一张低清
            图冒充原图。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteThumbnailUrl" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/search:
    x-chat-archive-deployments: [local, remote]
    get:
      operationId: searchRemoteArchive
      parameters:
        - { $ref: "#/components/parameters/RemoteSearchQuery" }
        - { $ref: "#/components/parameters/RemoteSourceAccountFilter" }
        - { $ref: "#/components/parameters/RemoteCursor" }
        # 过滤参数与本机 `/api/v1/search` **逐个同名同形**（记录模型 v7，
        # PSU-2.45）：同一个搜索表单、同一批查询参数，前端不为「这是哪一端」
        # 记第二套名字，也不为它写第二段映射。
        - name: conversation_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 512 }
            minItems: 1
            maxItems: 5
            uniqueItems: true
          description: >-
            要看的会话，可以重复给多个（PSU-2.74）。语义与本机同：维度之间 AND、
            维度之内 OR。

            **上限比本机小（5 对 20），这是如实的能力差异不是偷工**：远端不认得
            多值，所以多选是本机代理按值扇出 N 次远程请求再归并出来的——每多一个
            值就多一次跨境往返。这样换来的是不必升远端记录模型、不必重新部署两套
            远端实现。超过上限当场 QUERY_INVALID。
        - name: sender_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 512 }
            minItems: 1
            maxItems: 5
            uniqueItems: true
          description: 要看的发送人，可以重复给多个；语义与上限同 `conversation_id`。
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/MessageType" }
            minItems: 1
            maxItems: 11
        - name: has_attachment
          in: query
          required: false
          schema: { type: boolean }
        - { $ref: "#/components/parameters/DateFrom" }
        - { $ref: "#/components/parameters/DateTo" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: >-
            远程正文搜索。v7 远端走与本机同一套索引：带游标、总数、每会话计数
            与索引状态，并接六个过滤；更早的远端只答 items，而任何一个过滤或
            游标都会当场 QUERY_INVALID——**绝不悄悄不筛**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteSearchPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/shares:
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: createRemoteShare
      description: >-
        在线分享（PSU-2.181）：建一份草稿。本机经已配对的远端转过去，远程网页直接落在
        自己的 BFF 上，两端路径相同。快照按白名单剥掉其余字段；超限答
        SHARE_LIMIT_EXCEEDED；远端不是自建 SQLite 答 SHARE_UNSUPPORTED；本机没配对答
        REMOTE_NOT_CONFIGURED。请求体上限 3 MB，必须带 Content-Length。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareDraftRequest" }
      responses:
        "200":
          description: 草稿（state = draft），接着把 awaiting_upload 里的附件逐个传上、再定稿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteShare" }
        default:
          $ref: "#/components/responses/ErrorResponse"
    get:
      operationId: listRemoteShares
      description: 「我的分享」：生成好的分享，新的在前；草稿不列。
      responses:
        "200":
          description: 分享列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteShareList" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/shares/{token}:
    x-chat-archive-deployments: [local, remote]
    delete:
      operationId: deleteRemoteShare
      description: 真删：服务器上的副本与附件一并删除，链接立刻失效；归档里的原消息不受影响。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: 已删
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareDeleted" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/shares/{token}/objects/{attachment_id}:
    x-chat-archive-deployments: [local, remote]
    put:
      operationId: uploadRemoteShareObject
      description: >-
        传一个草稿里声明过的附件的原始字节。字节数必须与声明相同（否则
        SHARE_UPLOAD_MISMATCH），单个不超过 200 MB，必须带 Content-Length。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: attachment_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: 已放进远端的对象存储
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareObjectUploaded" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/shares/{token}/finalize:
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: finalizeRemoteShare
      description: 定稿，之后公开地址可读；还有附件没传上答 SHARE_INCOMPLETE。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: 已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteShare" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/shares/{token}/extend:
    x-chat-archive-deployments: [local, remote]
    post:
      operationId: extendRemoteShare
      description: 再给 7 天；已过期（还在 7 天宽限期里）的从现在起重新开 7 天；永久的不动。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: 新的失效时间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteShare" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/public/shares/{token}:
    x-chat-archive-deployments: [remote]
    x-chat-archive-profiles: [self_hosted_sqlite]
    get:
      operationId: getPublicShare
      description: >-
        在线分享的公开读取（PSU-2.180）：远端唯一一条不需要任何身份的接口，只有自建
        SQLite 部署注册它。只对已定稿且未过期的分享给快照与附件的短时地址，每成功一次
        计一次打开数；过期、已删、不存在、草稿一律回同一个 404 SHARE_GONE，响应逐字节相同。
        两种响应都带 Cache-Control: no-store、X-Robots-Tag: noindex, nofollow、
        Referrer-Policy: no-referrer。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: count_view
          in: query
          required: false
          description: >-
            公开参数，任何持有链接的人都可携带；只影响打开次数统计，不是访问控制，
            也不跳过有效性检查。前端仅在服务端 HTML 入口页已计数后的首轮接管传 false；
            默认每次成功读取计数。
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 分享的只读副本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /s/{token}:
    x-chat-archive-deployments: [remote]
    x-chat-archive-profiles: [self_hosted_sqlite]
    get:
      operationId: readPublicShareDocument
      security: []
      description: >-
        PSU-2.230：从当前分享快照直出语义 HTML；Accept 按 q 值优先 text/markdown 时返回 Markdown。
        不需要登录/绑定或 JavaScript。正文硬预算 12000 字符，响应还包含固定导航/元数据；
        长消息也可续读，cursor 是分享内的消息序号与字符偏移，不得用于原归档查询。
        全文完整与已到末尾分别标记，最后一页不代表本页包含全文。HTML 与 Markdown 仅入口页
        （不带 cursor）成功读取计一次打开，续读页不计；不执行 JS 的抓取（含链接预览）同样计数。
        前端接管用 count_view=false 避免重复。失效时 HTML 协商返回统一的 404 失效页。媒体仅提供分享作用域
        短地址，不签名或读取附件。全部表示保持 no-store/noindex/no-referrer，协商入口 Vary: Accept。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          description: 使用响应正文给出的下一部分地址；每页重新检查分享有效性。
          schema: { type: string, maxLength: 13 }
      responses:
        "200":
          description: 有界分享正文；HTML 中同时提供 Markdown alternate 与分页入口。
          content:
            text/html:
              schema: { type: string }
            text/markdown:
              schema: { type: string }
        "400":
          description: 仅对有效分享返回游标修复提示。
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: >-
            过期、已删、不存在、草稿与损坏快照统一失效，不回显标题/令牌。HTML 协商为同一份
            失效页（有前端产物时由 Vue 显示原失效态）；Markdown 协商为 SHARE_GONE。
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /s/{token}.md:
    x-chat-archive-deployments: [remote]
    x-chat-archive-profiles: [self_hosted_sqlite]
    get:
      operationId: readPublicShareMarkdown
      security: []
      description: 与分享文档同一快照/预算/游标/有效性策略；不依赖 Accept，固定返回 Markdown。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 13 }
      responses:
        "200":
          description: 明确标注完整性、当前范围、引用数据与下一部分的分享文本。
          content:
            text/markdown:
              schema: { type: string }
        "400":
          description: 有效分享的游标不正确，可去掉 cursor 重新读取。
          content:
            text/plain:
              schema: { type: string }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /s/{token}/media/{attachment_id}:
    x-chat-archive-deployments: [remote]
    x-chat-archive-profiles: [self_hosted_sqlite]
    get:
      operationId: openPublicShareMedia
      security: []
      description: >-
        每次重新检查分享有效性，仅允许该分享已上传的附件，再临时签名并 307 跳转；
        不增加正文打开次数。不扫描归档、不自动读取/解码媒体；已发出的签名仍按既有五分钟 TTL。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: attachment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "307":
          description: 受分享范围约束的短时对象地址；no-store/no-referrer。
          headers:
            Location:
              schema: { type: string, format: uri }
        "503":
          description: 对象存储暂时不可用或不支持签名；不回显 provider 错误。
          content:
            text/plain:
              schema: { type: string }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/bootstrap:
    x-chat-archive-deployments: [remote]
    post:
      operationId: completeBrowserSetup
      description: >-
        首次向导：回填部署时生成的一次性引导令牌并设置登录口令。令牌一次一用，
        用后入口永久关闭；口令不合强度要求时令牌保持可用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserSetupRequest" }
      responses:
        "200":
          description: 已初始化并登录；会话只经 HttpOnly Cookie 下发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSession" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/sign-in:
    x-chat-archive-deployments: [remote]
    post:
      operationId: browserSignIn
      description: >-
        口令登录。开启两步验证后还需 `second_factor`（验证码或恢复码）；
        但**是否需要**不通过接口回答——口令错、验证码错、缺失一律同一个拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserSignInRequest" }
      responses:
        "200":
          description: 登录成功；会话只经 HttpOnly Cookie 下发
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSession" }
        "429":
          description: 按来源退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/client-info:
    x-chat-archive-deployments: [remote]
    post:
      operationId: recordBrowserClientInfo
      description: >-
        为当前已认证会话补齐浏览器、系统与可获得的设备型号。仅自托管浏览器端支持。
        要求同源；不接受会话 ID，不保存完整 User-Agent、IP 或设备指纹。
        这些字段只用于展示，不作为认证或物理设备唯一标识。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserClientInfo" }
      responses:
        "204":
          description: 当前会话设备信息已补齐
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/sign-out:
    x-chat-archive-deployments: [remote]
    post:
      operationId: browserSignOut
      description: 结束当前浏览器会话并清除 Cookie；会话已失效时同样返回成功。
      responses:
        "200":
          description: 已登出
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSignedOut" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/totp/enrollment:
    x-chat-archive-deployments: [remote]
    post:
      operationId: beginTotpEnrollment
      description: >-
        开始绑定两步验证：服务端给出 `otpauth://` URI 与 base32 密钥，
        二维码由前端渲染。回填一个当前验证码之前不生效。
        与解绑一样需要登录口令——只凭一条会话就能绑上攻击者自己的验证器，
        会把持有正确口令的机主永久锁在门外。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpEnrollmentRequest" }
      responses:
        "200":
          description: 待绑定的密钥；此时两步验证尚未开启
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "429":
          description: 按来源退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/totp/enable:
    x-chat-archive-deployments: [remote]
    post:
      operationId: enableTotp
      description: 回填验证码使两步验证生效，并一次性返回恢复码；恢复码只显示这一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpEnableRequest" }
      responses:
        "200":
          description: 已开启；恢复码只在本次响应里出现
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnabled" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/totp/disable:
    x-chat-archive-deployments: [remote]
    post:
      operationId: disableTotp
      description: 用登录口令解绑两步验证；恢复码同时作废。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableRequest" }
      responses:
        "200":
          description: 已解绑
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpDisabled" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/state:
    x-chat-archive-deployments: [remote]
    get:
      operationId: getReauthState
      description: >-
        本机应用锁（PSU-2.213；PSU-2.221 起按设备）在当前会话上的状态。只需原登录身份，
        锁定态可用，不续期会话；不返回聊天、密钥列表或其他设备信息。顺带把会话绑定到
        这台浏览器的设备（HttpOnly 设备 Cookie，仅在首次或顺延时经 `Set-Cookie` 下发）。
      responses:
        "200":
          description: 再认证状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthState" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/challenge:
    x-chat-archive-deployments: [remote]
    post:
      operationId: createReauthChallenge
      description: >-
        为本会话、本用途生成一次性 WebAuthn 认证挑战（`userVerification: required`）。
        unlock 只在本机开着应用锁时可用；manage 在本机开锁时还需已解锁。只允许本机
        登记的凭据。要求同源。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthChallengeRequest" }
      responses:
        "200":
          description: 供 `navigator.credentials.get` 使用的选项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnChallenge" }
        "429":
          description: 验证失败退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/verify:
    x-chat-archive-deployments: [remote]
    post:
      operationId: verifyReauth
      description: >-
        提交认证断言。挑战一次一用；unlock 成功时经 `Set-Cookie` 下发解锁授权
        （`__Host-` HttpOnly，响应 JSON 里永远没有它），manage 成功时打开一个短的管理新鲜窗口。
        失败一律是同一个 REMOTE_REAUTH_REJECTED，并计入退避。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthVerifyRequest" }
      responses:
        "200":
          description: 验证通过后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthState" }
        "429":
          description: 验证失败退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/lock:
    x-chat-archive-deployments: [remote]
    post:
      operationId: lockReauth
      description: 幂等地撤销当前会话的解锁授权并提升锁定版本；已锁定也能调用。要求同源。
      responses:
        "200":
          description: 已锁定后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthState" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/password:
    x-chat-archive-deployments: [remote]
    post:
      operationId: unlockReauthWithPassword
      description: >-
        用登录口令解锁本机（指纹验证不了或浏览器不支持时的退路）。只需原登录身份，
        锁定态可用；本机未开应用锁时 409。错误口令是 REMOTE_SIGN_IN_REJECTED，与通行密钥
        失败共用本会话退避，另按来源退避。成功时与通行密钥解锁一样经 `Set-Cookie`
        下发解锁授权，并打开一个短的管理新鲜窗口。要求同源。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthPasswordRequest" }
      responses:
        "200":
          description: 解锁后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthState" }
        "429":
          description: 验证失败退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/notice:
    x-chat-archive-deployments: [remote]
    delete:
      operationId: dismissReauthNotice
      description: >-
        关掉「旧版应用锁已关闭，请在需要的设备上重新开启」的一次性提示。只需原登录身份；
        幂等。要求同源。
      responses:
        "204":
          description: 已关闭提示
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/reauth/policy:
    x-chat-archive-deployments: [remote]
    put:
      operationId: putReauthPolicy
      description: >-
        开启或关闭**本机**应用锁（只影响当前会话所绑定的设备）。需新鲜验证（通行密钥
        管理验证、刚登记、或刚用口令解锁）与本机版本 CAS；开启必须本机已有经验证可用的
        通行密钥，开启后当前会话直接解锁、本机其他会话各自重新解锁，其他设备不受影响。
        关闭时原子清除本机的网站通行密钥登记、授权、待完成挑战与新鲜验证状态，下次开启须
        重新录入；不删除设备或密码管理器中的密钥。登录会话、登录口令与两步验证保持不变。要求同源。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthPolicyRequest" }
      responses:
        "200":
          description: 改变后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthState" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/passkeys:
    x-chat-archive-deployments: [remote]
    get:
      operationId: listPasskeys
      description: 本机登记的通行密钥；只返回管理必需的元数据，需解锁。
      responses:
        "200":
          description: 通行密钥列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/passkeys/registration/options:
    x-chat-archive-deployments: [remote]
    post:
      operationId: beginPasskeyRegistration
      description: >-
        重新确认登录口令后生成注册挑战（attestation none、`userVerification: required`、
        excludeCredentials）。策略开启时还需已解锁并完成管理新鲜验证。要求同源。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegistrationOptionsRequest" }
      responses:
        "200":
          description: 供 `navigator.credentials.create` 使用的选项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnChallenge" }
        "429":
          description: 按来源退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/passkeys/registration/verify:
    x-chat-archive-deployments: [remote]
    post:
      operationId: finishPasskeyRegistration
      description: 校验注册响应并保存公钥；挑战一次一用，已登记过的 credential ID 直接拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegistrationVerifyRequest" }
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeySummary" }
        "429":
          description: 验证失败退避中；`Retry-After` 给出还要等多少秒
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
              description: 还需等待的秒数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/auth/passkeys/{passkey_id}:
    x-chat-archive-deployments: [remote]
    delete:
      operationId: deletePasskey
      description: 删除一枚通行密钥；需管理新鲜验证，策略开启时不能删最后一枚。要求同源。
      parameters:
        - name: passkey_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204":
          description: 已删除；由它签出的解锁授权同时失效
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/sessions:
    x-chat-archive-deployments: [remote]
    get:
      operationId: listBrowserSessions
      description: 本部署当前的浏览器会话；不含任何密文，`current` 标出发起本次请求的那一条。
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/sessions/revoke-all:
    x-chat-archive-deployments: [remote]
    post:
      operationId: revokeAllBrowserSessions
      description: 退出所有设备，包括当前这一条。
      responses:
        "200":
          description: 已撤销的会话数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSessionsRevoked" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/remote/sessions/{session_id}/revoke:
    x-chat-archive-deployments: [remote]
    post:
