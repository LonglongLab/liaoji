        - { $ref: "#/components/parameters/DateTo" }
        - name: utc_offset_minutes
          in: query
          required: false
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
          description: 日界所用的时区偏移（分钟，东为正）；浏览器传本机时区
      responses:
        "200":
          description: 该会话在区间内哪几天有消息，升序；日历据此只点亮有记录的日子
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDaysPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/search:
    get:
      operationId: searchMessages
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/SearchQuery" }
        - name: conversation_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 512 }
            minItems: 1
            maxItems: 20
            uniqueItems: true
          description: >-
            要看的会话，可以重复给多个（PSU-2.74）。**维度之间是 AND、维度之内
            是 OR**：给两个会话再给 `type=image`，问的是「这两个会话里的图片」。

            多值不是把 `=` 换成 `IN`：真实归档上 `conversation_id IN (?,?)` 会让
            规划器放弃会话序索引改走账号级全扫，两个旧的小会话实测 7,187 ms，而
            按值各查一页再归并只要 0.9 ms。所以服务端按值扇出，`total_count` 与
            每会话计数逐流相加——切片互不相交，是精确值不是估算。

            上限 20：再多就不是「挑几个会话」而是「换一种问法」，而每一个值都要
            多发一次查询。超过当场 QUERY_INVALID，不悄悄截断。
        - name: sender_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, minLength: 1, maxLength: 512 }
            minItems: 1
            maxItems: 20
            uniqueItems: true
          description: 要看的发送人，可以重复给多个；语义与上限同 `conversation_id`。
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/MessageType" }
            minItems: 1
            maxItems: 11
            uniqueItems: true
        - name: has_attachment
          in: query
          required: false
          schema: { type: boolean }
        - { $ref: "#/components/parameters/DateFrom" }
        - { $ref: "#/components/parameters/DateTo" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: file_class
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [doc, sheet, slide, archive, audio, app, other]
            minItems: 1
            maxItems: 7
            uniqueItems: true
          description: >-
            微信「文件管理」那一层文件类别：文稿 / 表格 / 幻灯片 / 压缩文件 /
            音频 / 应用程序 / 其他。按附件扩展名判定，扩展名到类别的对照表只在
            后端一份（`file_classes.py`）——浏览器只发类别 id，不需要那张表。

            它是「文件」下的**第二层**，所以必须与 `type=file` 同时给；单独给会
            当场 `QUERY_INVALID`，不然筛出来的东西读起来像「所有文稿」，而图片、
            语音也会照样进来。

            可以重复给多个（PSU-2.74）：多个类别就是扩展名的并集，一条 OR 条件，
            不像会话与发送人那样扇出——它们共用同一条按文件分区的索引。
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, oldest], default: newest }
          description: >-
            结果的排序线。**只有时间的两个方向。** 按大小排不在这里，也不该在
            这里：真实归档上实测，即使是最小的「文件」范围（6,287 行），按大小
            排也要把整个候选集物化再排一遍，每页 315–1,302 ms 且与翻多深无关
            ——正是 v2 索引当初重新设计所要避开的那种代价。给一个运行时才会被
            拒的枚举值，不如不给。

            游标绑定排序线：`newest` 下发出的游标拿到 `oldest` 请求上会当场报
            `CURSOR_INVALID`。位置本身在两个方向下都解得出来、都合法，然后静默
            给出互补的那一半——不报错，看起来只是「翻页翻丢了」。
      responses:
        "200":
          description: 全局搜索（中文子串），按所选排序线的键集游标分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/stats/analysis:
    x-chat-archive-deployments: [local, remote]
