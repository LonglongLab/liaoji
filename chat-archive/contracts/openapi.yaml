    x-chat-archive-deployments: [local]
    post:
      operationId: startWechatCleanupDrive
      description: >-
        替用户走到微信自己的「管理微信聊天数据」页、搜到这个会话并勾上（PSU-2.187）。止于勾选：
        绝不点「清理」、不碰日期。后台运行，进度用 GET /api/v1/wechat-cleanup/drive 取。
        同时只跑一个（再点答 JOB_ALREADY_RUNNING）；这台电脑做不到时答 WECHAT_UI_UNAVAILABLE。
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/AccountId" }
        - name: keep_months
          in: query
          required: false
          description: 用户在清理前面板里选的「保留最近」，交给浮窗算建议日期（PSU-2.188）。
          schema: { type: integer, enum: [1, 3, 6, 12], default: 3 }
      responses:
        "202":
          description: 已开始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatCleanupDrive" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/conversations/{conversation_id}/wechat-cleanup/sync:
    x-chat-archive-deployments: [local]
    post:
      operationId: startWechatCleanupSync
      description: >-
        清理前的「先同步」（PSU-2.190）：一条普通的同步作业，但原图只传这个会话、按「保留最近」算出的
        清理止点之前的那一段；正文仍按账号上传（远端按连续序号收，跳不过别的会话），缩略图与头像不跑。
        止点与就绪度接口是同一个数，同步完重查即对得上。进度用 GET /api/v1/jobs/{job_id} 取；
        已有同步在跑时答 JOB_ALREADY_RUNNING，没配对远端时答 REMOTE_NOT_CONFIGURED。
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { $ref: "#/components/parameters/AccountId" }
        - name: keep_months
          in: query
          required: false
          description: 用户在清理前面板里选的「保留最近」，决定上传范围的止点。
          schema: { type: integer, enum: [1, 3, 6, 12], default: 3 }
      responses:
        "202":
          description: 同步任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobCreated" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/wechat-cleanup/drive:
