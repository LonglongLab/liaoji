        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/MessageType" }
            minItems: 1
            maxItems: 11
            uniqueItems: true
        - name: has_attachment
          in: query
          required: false
          schema: { type: boolean }
        - { $ref: "#/components/parameters/DateFrom" }
        - { $ref: "#/components/parameters/DateTo" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
