            application/json:
              schema: { $ref: "#/components/schemas/JobCreated" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/search/index:
    get:
      operationId: getSearchIndexState
      description: >-
        这个归档的检索索引处在哪一步，以及开启它要付多少代价。用户点「建立索引」
        之前看到的预估就来自这里——前端不自己编数字。
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: 索引状态与预估占用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchIndexState" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: initializeSearchIndex
      description: >-
        开启这个归档的全文检索并开始建索引（PSU-2.88）。切分与写入在后台分片进行，
        所以这里立即返回，此后 `index_status` 会是 `building`，建完转 `ready`。
        对已经开着的归档是幂等的空操作，不会重头再建一遍。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchIndexRequest" }
      responses:
        "200":
          description: 已开启；返回此刻的状态与待索引的消息条数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchIndexState" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteSearchIndex
      description: >-
        关闭全文检索并删除索引结构。**不删任何消息**——归档本身、附件、同步状态
        全部不动，只是这个归档从此答 `not_initialized`，随时可以再开。
        腾出来的页面要等一次「回收磁盘空间」才会还给操作系统。
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: 已关闭；返回此刻的状态（`not_initialized`，索引条数归零）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchIndexState" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/storage/overview:
    get:
      operationId: getStorageOverview
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: >
            分离展示微信源文件、本地索引、媒体缓存和远程副本；未知占用显式为 null，
            不返回本机路径。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageOverview" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/storage/reclaim/preview:
    post:
      operationId: previewStorageReclaim
      description: >-
        回收前如实摆出的账：能删多少行、能腾多少字节、磁盘够不够跑 VACUUM。
        判据与执行逐字相同，所以预览说的话与实际做的事对得上。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageReclaimRequest" }
      responses:
        "200":
          description: 可回收量预览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReclaimPreview" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/storage/reclaim:
    post:
      operationId: startStorageReclaim
      description: >-
        删掉已确认上传的媒体工件、已被覆盖的发件箱历史版本与已确认批次的 JSON，
        然后 `VACUUM` 把腾出来的页面还给操作系统。**不删任何消息、任何附件记录**。
        实测分钟级（真机 prune 116 秒 + VACUUM 194 秒），所以返回的是一个作业，
        进度经 `GET /jobs/{job_id}` 轮询；期间导入与同步互斥。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageReclaimRequest" }
      responses:
        "202":
          description: 已排入作业
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [job_id]
                properties:
                  job_id: { type: string }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/storage/unload:
    post:
      operationId: unloadStorage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageUnloadRequest" }
      responses:
        "200":
          description: >
            在提交、对象校验、清单对账和恢复验证全部通过后卸载应用媒体缓存；
            微信源文件和本地索引保持不变。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUnloadResult" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/cache/cleanup/preview:
    post:
      operationId: previewCacheCleanup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheCleanupRequest" }
      responses:
        "200":
          description: 清理影响预览；快照可能因可恢复作业而阻塞
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheUsage" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/cache/cleanup:
    post:
      operationId: cleanupCache
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheCleanupRequest" }
      responses:
        "200":
          description: 已确认的单一分类清理结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheCleanupResult" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/attachments/{attachment_id}:
    get:
      operationId: getAttachment
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 附件元数据；内部 ID 访问，不接受任意路径
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentSummary" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/attachments/{attachment_id}/content:
    get:
      operationId: getAttachmentContent
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
        - name: audio_format
          in: query
          required: false
          schema: { type: string, enum: [mp3] }
          description: >-
            仅对 `kind = audio` 的附件有效（PSU-2.178）：给 `mp3` 时把解好的语音现转成
            单声道 mp3 再回，供压缩包导出放进 `附件/语音/`。对其它类型给这个参数回
            QUERY_INVALID（静默忽略会让调用方把别的东西当 mp3 存）；转不出来回
            MEDIA_FAILED，不拿 wav 冒充。只有本机端有这个能力，远端的语音原样是 wav。
      responses:
        "200":
          description: 受控缓存中的附件内容；只接受内部附件 ID
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/attachments/{attachment_id}/thumbnail:
    get:
      operationId: getAttachmentThumbnail
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: >-
            微信自带的缩略图字节（KB 量级）。主工件本身就是缩略图的行直接回主工件；
            没有缩略图时回 404 THUMBNAIL_UNAVAILABLE，调用方应静默回退 content。
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/attachments/{attachment_id}/retry:
    post:
      operationId: retryAttachment
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 只重试指定附件并返回最新状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentSummary" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/contacts:
    get:
      operationId: listContacts
      description: >-
        发送人名录（PSU-2.66）。全局搜索的「发送人」维度点开的就是它——名字一直在
        `contacts` 里，只是从来没有端点把它列出来，于是那个筛选框只能手输 uid。

        **不含命中数**：那要对全账号消息做 `GROUP BY sender_uid`，真实归档上实测
        21.8 秒。**不含备注**：真实归档 2,605 行的 remark 全是 NULL，送一个恒空的
        字段会被读成「这些人都没设备注」。

        按 `(display_name, contact_uid)` 分页，**不承诺拼音序**——SQLite 默认
        collation 下中文是码位序；只保证稳定、不重不漏。
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >-
            按名字过滤；LIKE 通配符按字面处理。与 `/api/v1/conversations` 的 `q`
            同一套规矩（PSU-2.74）：子序列匹配，结果先按匹配得有多准分档，
            再按名字排。
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: 一页发送人名录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactDirectoryPage" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/contacts/{contact_id}:
    get:
      operationId: getContact
      parameters:
        - name: contact_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 联系人基础资料；来源可用性不足时字段为 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSummary" }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/avatars/{avatar_id}:
    get:
      operationId: getAvatar
      parameters:
        - name: avatar_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 鎸夎处鍙峰拰涓嶆槑 ID 鏍煎畾鐨勫ご鍍忓唴瀹癸紱鏈嶅姟绔紦瀛樹负绉佹湁
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Referrer-Policy:
              schema: { type: string, enum: [no-referrer] }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/sources/probe:
    get:
      operationId: probeSources
      responses:
        "200":
          description: 本地数据源能力探测
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceProbe" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: 已探测账号的脱敏列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/sources/{source_id}/key-acquisition:
    post:
      operationId: acquireSourceKey
      parameters: [{ $ref: "#/components/parameters/SourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyAcquisitionRequest" }
      responses:
        "200":
          description: 密钥已安全保存并验证
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyStatus" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/sources/{source_id}/key:
    delete:
      operationId: deleteSourceKey
      parameters: [{ $ref: "#/components/parameters/SourceId" }]
      responses:
        "204": { description: 密钥引用已删除 }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/imports:
    post:
      operationId: createImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "202":
          description: 导入任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobCreated" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    get:
      operationId: listJobs
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: 账号任务列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs/{job_id}:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    get:
      operationId: getJob
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 任务详情，不暴露内部 checkpoint
          content:
