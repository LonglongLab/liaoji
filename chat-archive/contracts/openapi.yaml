              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs/{job_id}/pause:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    post:
      operationId: pauseJob
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 已请求在控制点暂停
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs/{job_id}/resume:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    post:
      operationId: resumeJob
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 任务已恢复并重新启动 worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs/{job_id}/cancel:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    post:
      operationId: cancelJob
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 已取消或请求在控制点取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/jobs/{job_id}/events:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    get:
      operationId: streamJobEvents
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/AccountId" }
        - name: wait_ms
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 60000, default: 25000 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 可持久续传的任务事件流
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/estimate:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    description: Shared local/self-hosted SQLite operation. Remote requires browser session and remote-stats or remote-export capability. Workers and PostgreSQL do not claim these capabilities.
    post:
      operationId: estimateExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportScope" }
      responses:
        "200":
          description: 导出规模估算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportEstimate" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    description: Shared local/self-hosted SQLite operation. Remote requires browser session and remote-stats or remote-export capability. Workers and PostgreSQL do not claim these capabilities.
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: 导出任务已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCreated" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    get:
      operationId: listExports
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200":
          description: 导出历史
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPage" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/{export_id}:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    delete:
      operationId: deleteExport
      summary: Delete one owned export and its system-managed derivatives
      description: Requires a terminal export task. Removes only validated export files, temporary snapshots, export history and precisely linked job events. Original messages and attachment objects are preserved. Downloaded copies, independent shares, backups and forensic media erasure are outside this operation. Cleanup failures remain retryable with download access revoked. Legacy jobs without export identity are retained and explicitly reported. Workers and PostgreSQL do not claim export capabilities.
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Owned derivatives removed; legacy-job limitations are explicit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportDeletion" }
        default: { $ref: "#/components/responses/ErrorResponse" }
    get:
      operationId: getExport
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 逐对象归属校验后的导出详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/preview:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    description: Shared local/self-hosted SQLite operation. Remote requires browser session and remote-stats or remote-export capability. Workers and PostgreSQL do not claim these capabilities.
    post:
      operationId: previewExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportScope" }
      responses:
        "200":
          description: 本机所选范围内最多三条消息，不附带范围外引用正文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/{export_id}/download:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    get:
      operationId: downloadExport
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 本机已完成的离线网页压缩包，先核对账号归属
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/{export_id}/report:
    x-chat-archive-deployments: [local, remote]
    x-chat-archive-profiles: [local, self_hosted_sqlite]
    get:
      operationId: getExportReport
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: 导出实际条数与附件结果，本机专属
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportReport" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /api/v1/exports/{export_id}/open-folder:
    post:
      operationId: openExportFolder
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "204": { description: 在本机文件管理器中打开导出目录 }
        default: { $ref: "#/components/responses/ErrorResponse" }
components:
  parameters:
    AccountId:
      name: account_id
      in: query
      required: true
      schema: { type: string }
      description: 所有业务查询必须显式携带账号 ID
    SourceId:
      name: source_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^job_[A-Za-z0-9_-]{8,64}$"
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string }
    RemoteConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 不透明游标；非法或过期返回 CURSOR_INVALID
    RemoteCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 4096 }
      description: 与远程 profile 和查询范围绑定的防篡改不透明游标
    RemoteSourceAccountFilter:
      name: source_account_id
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: >-
        只要这条上传流（账号）的行（记录模型 v3，PSU-2.35a）。缺省不过滤。
        远端不到 v3 时答 QUERY_INVALID，绝不悄悄忽略过滤；界面按
        `record_model_version` 决定要不要带。游标绑定过滤范围：换账号或摘掉
        过滤后旧游标一律 CURSOR_INVALID。
    RemoteConversationFilter:
      name: q
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        只保留匹配这段文字的会话（记录模型 v4，PSU-2.39）。缺省不过滤。匹配会话
        名称，以及名字还没送到时列表实际显示的那个不透明标识。与本机
        `/api/v1/conversations` 的 `q` 是同一个框里的同一次输入，但这一端能匹配的
        **更少**：远程归档没有联系人备注与群成员名单。远端不到 v4 时答
        QUERY_INVALID，绝不悄悄不过滤——那会让人以为「搜不到」而不是「这一端
        搜不了」。关键词绑进游标范围：换词后旧游标一律 CURSOR_INVALID。
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500 }
    SearchQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: 正文检索词；省略或全为空白时不做正文检索，只按其余筛选条件按时间倒序浏览
    BrowserSessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: 浏览器会话的不透明 id
    RemoteDeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: 同步设备的不透明 id
    RemoteSearchQuery:
      name: q
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        远程正文搜索词；浏览器提交前去除首尾空白。**可缺省**（记录模型 v7）：
        只按日期或类型筛、不给关键词，与本机 `/api/v1/search` 是同一种用法。
        既不给关键词也不给任何过滤时答空页——那是「浏览整个归档」，会话列表干的事
    DateFrom:
      name: date_from
      in: query
      required: false
      schema: { type: integer }
      description: Unix 秒，含端点
    DateTo:
      name: date_to
      in: query
      required: false
      schema: { type: integer }
      description: Unix 秒，含端点
  responses:
    ErrorResponse:
      description: 结构化错误；不得包含密钥、正文、完整路径或 URL
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ObjectStorageUnauthorized:
      description: 未通过本地远程凭据校验
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ObjectStorageArchiveNotFound:
      description: 当前远程档案不存在或不可访问
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ObjectStorageConfigurationInvalid:
      description: 配置字段不合法；不包含 provider 原始错误正文
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ObjectStorageVerificationFailed:
      description: 合成对象真实往返验证失败；旧配置保持不变
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ObjectStorageGenerationMismatch:
      description: 该对象存储代号不存在，或附件属于另一代存储
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FeedbackUpstreamRejected:
      description: >-
        反馈平台拒收了这条反馈（隐私模式命中、项目标识不对……）。`error` 就是
        本契约共用的错误信封；`upstream` 是并列的一段机器可读的理由，不塞进
        信封里——`Error` 是所有端点共用的形状，为一条端点给它加字段会让每一条
        错误响应都多带一个恒为 null 的键（`Retry-After` 当初也是为此走的头）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FeedbackRejection" }
  schemas:
    ShareDraftRequest:
      type: object
      additionalProperties: false
      required: [title, expires_in_days, snapshot, attachments]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        expires_in_days:
          description: 1 / 7 / 30 天，null 表示永久
          type: [integer, "null"]
          enum: [1, 7, 30, null]
        snapshot: { $ref: "#/components/schemas/ShareSnapshot" }
        attachments:
          description: 要带上的附件，之后按这里的大小逐个上传。单个不超过 200 MB，合计不超过 1 GB。
          type: array
          items: { $ref: "#/components/schemas/ShareDeclaredAttachment" }
    ShareDeclaredAttachment:
      type: object
      additionalProperties: false
      required: [attachment_id, size, mime_type]
      properties:
        attachment_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$" }
        size: { type: integer, minimum: 0 }
        mime_type: { type: [string, "null"] }
        sha256:
          description: >-
            这份要带上的字节的 SHA-256（PSU-2.184）。远端归档里有同样内容时直接在对象存储里
            复制，不必再传；不带的一律要传。
          type: string
          pattern: "^[0-9a-f]{64}$"
    ShareSnapshot:
      description: >-
        生成那一刻的只读副本，由客户端组好；隐藏名字也在客户端做掉。服务端按白名单
        重建，这里之外的字段一律剥掉。最多 500 条消息，序列化后不超过 2 MB。
      type: object
      additionalProperties: false
      required: [version, names_hidden, messages]
      properties:
        version: { type: integer, const: 1 }
        names_hidden: { type: boolean }
        messages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/ShareSnapshotMessage" }
    ShareSnapshotMessage:
      type: object
      additionalProperties: false
      required: [time, sender, is_self, type, text, quote, card, attachments, transcript]
      properties:
        time: { type: integer, minimum: 0 }
        sender: { type: [string, "null"] }
        is_self: { type: [boolean, "null"] }
        type:
          type: string
          enum: [text, image, audio, video, file, link, quote, emoji, app, system, unknown]
        text: { type: string }
        quote:
          anyOf:
            - { $ref: "#/components/schemas/ShareSnapshotQuote" }
            - { type: "null" }
        card:
          anyOf:
            - { $ref: "#/components/schemas/ShareSnapshotCard" }
            - { type: "null" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ShareSnapshotAttachment" }
        transcript: { type: [string, "null"], description: 语音转写（机器写的） }
    ShareSnapshotQuote:
      type: object
      additionalProperties: false
      required: [sender, type, text]
      properties:
        sender: { type: [string, "null"] }
        type:
          type: string
          enum: [text, image, audio, video, file, link, quote, emoji, app, system, unknown]
        text: { type: string }
    ShareSnapshotCard:
      type: object
      additionalProperties: false
      required: [kind, title, subtitle, source_name, url, items]
      properties:
        kind: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        source_name: { type: [string, "null"] }
        url: { type: [string, "null"] }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ShareSnapshotCardItem" }
    ShareSnapshotCardItem:
      type: object
      additionalProperties: false
      required: [sender, kind, text]
      properties:
        sender: { type: [string, "null"] }
        kind: { type: string }
        text: { type: [string, "null"] }
    ShareSnapshotAttachment:
      type: object
      additionalProperties: false
      required: [attachment_id, kind, size, duration_ms, file_name, mime_type]
      properties:
        attachment_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$" }
        kind: { type: string, enum: [image, emoji, audio, video, file, unknown] }
        size: { type: [integer, "null"] }
        duration_ms: { type: [integer, "null"] }
        file_name: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
    RemoteShare:
      type: object
      additionalProperties: false
      required: [token, url, path, title, message_count, attachment_count, attachment_bytes,
                 created_at, expires_at, state, views, last_viewed_at, purge_at]
      properties:
        token: { type: string }
        url:
          description: >-
            能直接复制的完整链接。本机上是远端对外地址 + path；远程网页上是 null，
            页面用当前 origin 拼 path。
          type: [string, "null"]
        path: { type: string, description: 远端上的页面地址 /s/<token> }
        title: { type: string }
        message_count: { type: integer, minimum: 0 }
        attachment_count: { type: integer, minimum: 0 }
        attachment_bytes: { type: integer, minimum: 0 }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"], description: null 表示永久 }
        state: { type: string, enum: [draft, live, expired] }
        views: { type: integer, minimum: 0 }
        last_viewed_at: { type: [integer, "null"] }
        purge_at:
          description: 过期的（过期后再留 7 天）与草稿什么时候被清掉；有效的是 null
          type: [integer, "null"]
        awaiting_upload:
          description: >-
            只在建草稿的应答里有（PSU-2.184）：还要逐个上传的分享内附件 id。带了 sha256、
            远端归档里又有同样内容的，已经在对象存储里复制好，不在这里。没有这个键
            （旧远端）按「全部要传」理解。
          type: array
          items: { type: string }
    RemoteShareList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteShare" }
    ShareDeleted:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    ShareObjectUploaded:
      type: object
      additionalProperties: false
      required: [uploaded]
      properties:
        uploaded: { type: boolean, const: true }
    PublicShare:
      type: object
      additionalProperties: false
      required: [title, message_count, created_at, expires_at, snapshot, attachments]
      properties:
        title: { type: string }
        message_count: { type: integer, minimum: 0 }
        created_at: { type: integer }
        expires_at:
          type: [integer, "null"]
          description: null 表示长期有效
        snapshot: { $ref: "#/components/schemas/ShareSnapshot" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/PublicShareAttachment" }
    PublicShareAttachment:
      type: object
      additionalProperties: false
      required: [attachment_id, mime_type, size, url, expires_at]
      properties:
        attachment_id: { type: string }
        mime_type: { type: [string, "null"] }
        size: { type: integer, minimum: 0 }
        url:
          type: [string, "null"]
          description: 5 分钟有效的直读地址；对象存储暂时签不出来时为 null
        expires_at: { type: [integer, "null"] }
    ObjectStorageGeneration:
      type: object
      additionalProperties: false
      required:
        [storage_generation, endpoint, bucket, region, access_key_hint,
         updated_at, active]
      properties:
        storage_generation: { type: integer, minimum: 1 }
        endpoint: { type: string, format: uri }
        bucket: { type: string, minLength: 1, maxLength: 128 }
        region: { type: string, minLength: 1, maxLength: 64 }
        access_key_hint: { type: string, pattern: "^AKID\\*{4}[A-Za-z0-9_-]{4}$" }
        updated_at: { type: integer, minimum: 1 }
        active: { type: boolean }
    ObjectStorageConfig:
      type: object
      additionalProperties: false
      required:
        [configured, provider, endpoint, bucket, region, access_key_hint,
         storage_generation, status, updated_at, generations]
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [tencent_cos, s3_compatible, minio] }
        endpoint: { type: [string, "null"], format: uri }
        bucket: { type: [string, "null"], minLength: 1, maxLength: 128 }
        region: { type: [string, "null"], minLength: 1, maxLength: 64 }
        access_key_hint:
          type: [string, "null"]
          pattern: "^AKID\\*{4}[A-Za-z0-9_-]{4}$"
        storage_generation: { type: integer, minimum: 1 }
        status: { type: string, enum: [healthy, degraded, not_configured] }
        updated_at: { type: [integer, "null"], minimum: 1 }
        generations:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/ObjectStorageGeneration" }
    ObjectStorageConfigUpdate:
      type: object
      additionalProperties: false
      required: [provider, endpoint, bucket, region, secret_id, secret_key]
      properties:
        provider: { type: string, enum: [tencent_cos, s3_compatible, minio] }
        endpoint: { type: string, format: uri, minLength: 8, maxLength: 512 }
        bucket: { type: string, minLength: 3, maxLength: 128 }
        region: { type: string, minLength: 2, maxLength: 64 }
        secret_id: { type: string, minLength: 10, maxLength: 64 }
        secret_key: { type: string, minLength: 8, maxLength: 512, writeOnly: true }
    ObjectStorageGenerationRestore:
      type: object
      additionalProperties: false
      required: [storage_generation]
      properties:
        storage_generation: { type: integer, minimum: 1 }
    ObjectStorageVerification:
      type: object
      additionalProperties: false
      required: [verified, status, capabilities]
      properties:
        verified: { type: boolean }
        status: { type: string, enum: [healthy, degraded] }
        capabilities:
          type: object
          additionalProperties: false
          required: [missing, unknown]
          properties:
            missing:
              description: >-
                这个 provider **明说**没有的能力。只有它决定 `status`。
              type: array
              items: { type: string }
            unknown:
              description: >-
                问不到答案的能力（PSU-2.57）。典型是密钥没有读桶生命周期配置的
                权限，`AccessDenied` 一来就既证明不了有、也证明不了没有。
                不并进 `missing`——那会把一个权限事实报成 provider 故障；也不
                省略，问不到这件事本身要说出来。
              type: array
              items: { type: string }
    SourceProbe:
      type: object
      additionalProperties: false
      required:
        [
          client_running,
          snapshot_mode_available,
          snapshot_required,
          accounts_detected,
          available_key_methods,
        ]
      properties:
        client_running: { type: boolean }
        snapshot_mode_available: { type: boolean }
        snapshot_required: { type: boolean }
        accounts_detected: { type: integer, minimum: 0 }
        available_key_methods:
          type: array
          description: 本次探测判定可用的取密钥方式；空数组表示当前无法获取密钥。
          items: { type: string, enum: [passive, debugger] }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, client_version, has_key]
      properties:
        id: { type: string }
        display_name: { type: string }
        client_version: { type: [string, "null"] }
        has_key: { type: boolean }
    SourcePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceSummary" }
    KeyAcquisitionRequest:
      type: object
      additionalProperties: false
      required: [method, user_consent]
      properties:
        method: { type: string, minLength: 1, maxLength: 64 }
        user_consent: { type: boolean }
    KeyStatus:
      type: object
      additionalProperties: false
      required: [status, has_key]
      properties:
        status: { type: string, enum: [valid] }
        has_key: { type: boolean }
    ImportRequest:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 128 }
        conversation_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          default: []
        date_from: { type: [integer, "null"], minimum: 0, default: null }
        date_to: { type: [integer, "null"], minimum: 0, default: null }
        discover_attachments:
          description: >-
            是否在导入时定位附件并建立附件行。默认 true——发现只是一次坐标索引
            查表，很便宜，而且它是事后一切补救的前提：没有附件行，以后既不能预览
            也不能上传，只能重新导入，而重新导入依赖微信原始数据还在。
          type: boolean
          default: true
        decode_media:
          description: >-
            是否在导入时就把附件解成可播放的副本。PSU-2.88 起默认 **false**：解出来
            的东西只有上传和预览需要，而这两条路都会按需现解。导入期预解会写满
            媒体缓存（真机实测 5.02 GiB），其中大部分用户永远不会打开。
          type: boolean
          default: false
        build_search_index:
          description: >-
            是否为这个归档建立全文检索索引。PSU-2.88 起默认 **false**：备份与浏览
            都不需要它，而它按真机实测要占 GiB 级。此后这个字段只决定新归档的初始
            状态——已经开着索引的归档，无论这里传什么都会继续索引新消息。
          type: boolean
          default: false
        # 默认 false：普通更新只读源里变过的部分（按分片签名与每表 local_id 判定）。
        # true 是逃生门，用于增量判据看不见的两类改动：原地改写的行，
        # 以及没有新消息但改了名的会话。
        full_rescan: { type: boolean, default: false }
    JobCreated:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id: { type: string, pattern: "^job_[A-Za-z0-9_-]{8,64}$" }
    Job:
      type: object
      additionalProperties: false
      required:
        [id, source_account_id, kind, trigger, status, stage, progress_current,
         progress_total,
         stage_progress_current, stage_progress_total, stage_progress_unit,
         stage_started_at, oldest_imported_at, remote_available_bytes, pending_bytes,
         recoverable, error_code, created_at,
         started_at, finished_at, updated_at]
      properties:
        id: { type: string }
        source_account_id: { type: string }
        kind: { type: string }
        trigger:
          type: string
          enum: [manual, auto]
          description: >-
            谁发起的这条作业。`auto` 是自动同步排的那一轮（PSU-2.133），
            `manual` 是人点的。本单元之前建的行没有这个记号，一律读成
            `manual`——它们全都是人点出来的。
        status:
          type: string
          enum: [queued, running, pausing, paused, interrupted, completed, failed, cancelled]
        stage: { type: [string, "null"] }
        progress_current: { type: integer, minimum: 0 }
        progress_total: { type: [integer, "null"], minimum: 0 }
        stage_progress_current: { type: integer, minimum: 0 }
        stage_progress_total: { type: [integer, "null"], minimum: 0 }
        stage_progress_unit:
          type: [string, "null"]
          enum: [bytes, items, null]
        stage_started_at: { type: [integer, "null"] }
        verification_phase:
          type: string
          enum: [preparing, publishing, readback, completed]
          description: Attachment verification substep; stage counts are verified parent messages, independent of uploaded items. Absent on older servers and non-verification jobs.
        verification_last_progress_at:
          type: [integer, "null"]
          description: Server epoch milliseconds of the latest confirmed publication; waiting is not itself failure.
        verification_observed_at:
          type: integer
          description: Server epoch milliseconds when this verification state was read, for truthful elapsed time even when its last checkpoint is old.
        verification_prepared_count:
          type: integer
          minimum: 0
          description: Historical messages inspected during bounded recovery, distinct from confirmed publications.
        deferred_avatar_count:
          type: integer
          minimum: 0
          description: Avatars still pending after this run. They remain failed or pending; completed sync with a positive count must display a warning.
        originals_included:
          type: boolean
          description: Whether this sync run included originals. Absent on historical jobs with no stored scope.
        sync_activity:
          type: string
          enum: [uploading, checking, retrying]
          description: Current upload activity, including bounded transient retries. Absent outside an active upload step.
        sync_last_progress_at:
          type: [integer, "null"]
          description: Server epoch milliseconds of the latest confirmed upload in this sync run.

        # 逆序导入(PSU-2.22 形态 B)的时间水位:本 job 已提交的最早消息时间戳。
        # 非导入类 job、或尚无任何已提交批时为 null——不伪造时间维度。
        oldest_imported_at: { type: [integer, "null"] }
        remote_available_bytes:
          type: [integer, "null"]
          minimum: 0
          description: >-
            这一段因为空间停下时，远端自己报的剩余字节；别的停法一律 null。
            null 是「这件事跟空间无关」，不是「空间是 0」。
        pending_bytes:
          type: [integer, "null"]
          minimum: 0
          description: >-
            同上那一刻本机估计还欠的字节。**这是个高估的下限**：它只排除本机
            传过的，别的机器传过的同一份字节被算了第二遍；长度没记下来的行
            又一个字节都没算。摆出来是为了让人自己判断，不是让程序拿它当闸门。
        recoverable: { type: boolean }
        error_code: { type: [string, "null"] }
        created_at: { type: integer }
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
        updated_at: { type: integer }
    JobPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
    JobEventPayload:
      type: object
      additionalProperties: false
      required:
        [job_id, event_type, status, stage, progress_current, progress_total,
         stage_progress_current, stage_progress_total, stage_progress_unit,
         stage_started_at, error_code, created_at]
      properties:
        job_id: { type: string }
        event_type: { type: string }
        status:
          type: string
          enum: [queued, running, pausing, paused, interrupted, completed, failed, cancelled]
        stage: { type: [string, "null"] }
        progress_current: { type: integer, minimum: 0 }
        progress_total: { type: [integer, "null"], minimum: 0 }
        stage_progress_current: { type: integer, minimum: 0 }
        stage_progress_total: { type: [integer, "null"], minimum: 0 }
        stage_progress_unit:
          type: [string, "null"]
          enum: [bytes, items, null]
        stage_started_at: { type: [integer, "null"] }
        error_code: { type: [string, "null"] }
        created_at: { type: integer }
    ExportScope:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string }
        conversation_ids:
          type: array
          items: { type: string }
          default: []
        date_from: { type: [integer, "null"] }
        date_to: { type: [integer, "null"] }
        message_types:
          type: array
          items: { type: string }
          default: []
        attachment_kinds:
          type: array
          items: { type: string, enum: [image, emoji, audio, video, file] }
          description: 默认为图片、表情、语音和文件；空数组表示不携带附件
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: 导出名称，默认为聊天记录，不用作磁盘路径
    ExportRequest:
      type: object
      additionalProperties: false
      required: [scope, format]
      properties:
        scope: { $ref: "#/components/schemas/ExportScope" }
        format: { type: string, enum: [jsonl, json, csv, html] }
    ExportEstimate:
      type: object
      additionalProperties: false
      required:
        [message_count, conversation_count, media_ready, media_pending, media_missing,
         estimated_bytes]
      properties:
        message_count: { type: integer, minimum: 0 }
        conversation_count: { type: integer, minimum: 0 }
        media_ready: { type: integer, minimum: 0 }
        media_pending: { type: integer, minimum: 0 }
        media_missing: { type: integer, minimum: 0 }
        estimated_bytes: { type: integer, minimum: 0 }
    ExportReport:
      type: object
      additionalProperties: false
      required: [message_count, included, missing, excluded]
      properties:
        message_count: { type: integer, minimum: 0 }
        included: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
        excluded: { type: integer, minimum: 0 }
    ExportCreated:
      type: object
      additionalProperties: false
      required: [job_id, export_id]
      properties:
        job_id: { type: string }
        export_id: { type: string }
    ExportDeletion:
      type: object
      additionalProperties: false
      required: [deleted, legacy_job_history_retained]
      properties:
        deleted: { type: boolean, const: true }
        legacy_job_history_retained: { type: boolean, description: Old export jobs lack an export identity and have not been deleted by inference }
    Export:
      type: object
      additionalProperties: false
      required:
        [id, source_account_id, format, scope, status, record_count, size_bytes,
         error_code, created_at, finished_at]
      properties:
        deletion_pending: { type: boolean, description: Cleanup is incomplete; download access is revoked and deletion may be retried }
        bundle_available: { type: boolean, description: 本机实际存在可下载的离线网页包；旧版 HTML 为 false }
        id: { type: string }
        source_account_id: { type: string }
        format: { type: string, enum: [jsonl, json, csv, html] }
        scope:
          type: object
          additionalProperties: true
          properties:
            title: { type: string }
        status: { type: string, enum: [running, ready, failed, cancelled, missing] }
        record_count: { type: [integer, "null"] }
        size_bytes: { type: [integer, "null"] }
        error_code: { type: [string, "null"] }
        created_at: { type: integer }
        finished_at: { type: [integer, "null"] }
    ExportPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Export" }
    BrowserSetupRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_token, password]
      properties:
        bootstrap_token:
          type: string
          minLength: 1
          maxLength: 256
          description: 部署时生成的一次性引导令牌；一次一用，用后入口永久关闭
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: 新的登录口令；服务端只存 scrypt 摘要
    BrowserSignInRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
        second_factor:
          type: [string, "null"]
          maxLength: 64
          description: >-
            两步验证码或恢复码。登录页恒显示这一栏（写明未开启可留空）——
            按需索取等于告诉猜的人口令那一半已经猜对。
    BrowserSession:
      type: object
      additionalProperties: false
      required: [authenticated, totp_enabled, idle_expires_at, absolute_expires_at]
      properties:
        authenticated: { type: boolean }
        totp_enabled: { type: boolean }
        idle_expires_at:
          type: integer
          description: 不再活动即到期的 Unix 秒；每次请求顺延
        absolute_expires_at:
          type: integer
          description: 无论是否活动都到期的 Unix 秒
    BrowserSignedOut:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated: { type: boolean, enum: [false] }
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: base32 密钥，供无法扫码时手工录入
        otpauth_uri:
          type: string
          description: 二维码内容；由前端渲染，服务端不生成图片
    TotpEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
    TotpEnabled:
      type: object
      additionalProperties: false
      required: [totp_enabled, recovery_codes]
      properties:
        totp_enabled: { type: boolean, enum: [true] }
        recovery_codes:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string }
          description: 一次性恢复码；只在本次响应里出现，服务端只存慢哈希
    TotpDisableRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    TotpDisabled:
      type: object
      additionalProperties: false
      required: [totp_enabled]
      properties:
        totp_enabled: { type: boolean, enum: [false] }
    ReauthState:
      type: object
      additionalProperties: false
      required:
        [supported, enabled, locked, policy_version, unlocked_until, fresh_until, has_passkeys, migration_notice]
      properties:
        supported:
          type: boolean
          description: >-
            本部署是否已配置 WebAuthn RP 且依赖可用；false 时不能开启，已开启的设备只能用口令解锁
        enabled: { type: boolean, description: 本机（当前会话绑定的设备）是否开着应用锁 }
        locked:
          type: boolean
          description: enabled 且本会话没有有效解锁授权
        policy_version: { type: integer, minimum: 0, description: 本机应用锁开关的 CAS 版本 }
        unlocked_until: { type: [integer, "null"], description: 解锁授权的绝对到期时刻（Unix 秒） }
        fresh_until:
          type: [integer, "null"]
          description: 管理新鲜窗口到期时刻（Unix 秒）。成功登记通行密钥也会打开这个窗口
        has_passkeys: { type: boolean }
        migration_notice:
          type: boolean
          description: >-
            旧版（账户级）应用锁在升级时已关闭、本会话还没看过提示；true 时提示用户在需要的
            设备上重新开启，`DELETE /api/v1/auth/reauth/notice` 关掉它。
    ReauthChallengeRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [unlock, manage] }
    WebAuthnChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, purpose, expires_at, options]
      properties:
        challenge_id: { type: string, maxLength: 128 }
        purpose: { type: string, enum: [register, unlock, manage] }
        expires_at: { type: integer }
        options:
          type: object
          additionalProperties: true
          description: >-
            WebAuthn Level 3 JSON 形态的 PublicKeyCredentialCreationOptions /
            PublicKeyCredentialRequestOptions（二进制字段为 base64url）
    ReauthVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, minLength: 1, maxLength: 128 }
        credential:
          type: object
          additionalProperties: true
          description: 浏览器 `PublicKeyCredential.toJSON()` 的结果；序列化后不超过 16 KiB
    ReauthPolicyRequest:
      type: object
      additionalProperties: false
      required: [enabled, policy_version]
      properties:
        enabled: { type: boolean }
        policy_version: { type: integer, minimum: 0, description: 乐观并发：须等于当前版本 }
    ReauthPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    PasskeyRegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024 }
    PasskeyRegistrationVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, minLength: 1, maxLength: 128 }
        credential:
          type: object
          additionalProperties: true
          description: 浏览器 `PublicKeyCredential.toJSON()` 的结果；序列化后不超过 16 KiB
        label: { type: [string, "null"], maxLength: 80 }
    PasskeySummary:
      type: object
      additionalProperties: false
      required: [id, label, created_at, last_used_at, backed_up]
      properties:
        id: { type: string }
        label: { type: string, maxLength: 40 }
        created_at: { type: integer }
        last_used_at: { type: [integer, "null"] }
        backed_up: { type: boolean, description: 凭据是否已由提供方同步备份 }
    PasskeyPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/PasskeySummary" }
    BrowserClientInfo:
      type: object
      additionalProperties: false
      required: [model, platform, browser, device_type]
      properties:
        model: { type: [string, "null"], maxLength: 80 }
        platform: { type: [string, "null"], maxLength: 32 }
        browser: { type: [string, "null"], maxLength: 64 }
        device_type: { type: string, enum: [mobile, tablet, desktop, unknown] }
    SyncClientInfo:
      type: object
      additionalProperties: false
      required: [computer_name, platform, client_name]
      properties:
        computer_name: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, minLength: 1, maxLength: 32 }
        client_name: { type: string, minLength: 1, maxLength: 32 }
    BrowserSessionSummary:
      type: object
      additionalProperties: false
      required:
        [id, created_at, last_seen_at, idle_expires_at, absolute_expires_at, current]
      properties:
        id: { type: string }
        created_at: { type: integer }
        last_seen_at: { type: integer }
        idle_expires_at: { type: integer }
        absolute_expires_at: { type: integer }
        current:
          type: boolean
          description: 是否为发起本次请求的那一条会话
        client_info:
          anyOf:
            - { $ref: "#/components/schemas/BrowserClientInfo" }
            - { type: "null" }
          description: 自动识别的展示信息；旧会话或未采集时为空，不能倒推历史设备身份。
    BrowserSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BrowserSessionSummary" }
    BrowserSessionRevoked:
      type: object
      additionalProperties: false
      required: [session_id, status]
      properties:
        session_id: { type: string }
        status: { type: string, enum: [revoked] }
    BrowserSessionsRevoked:
      type: object
      additionalProperties: false
      required: [revoked_sessions]
      properties:
        revoked_sessions: { type: integer, minimum: 0 }
    RemoteDeviceSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, status, created_at, last_seen_at, revoked_at]
      properties:
        id: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, revoked] }
        created_at: { type: integer }
        last_seen_at: { type: [integer, "null"] }
        revoked_at: { type: [integer, "null"] }
        client_info:
          anyOf:
            - { $ref: "#/components/schemas/SyncClientInfo" }
            - { type: "null" }
          description: 采集端自动上报的电脑信息；旧客户端未连接时为空，配对名称保持不变。
    RemoteDevicePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteDeviceSummary" }
    RemoteDeviceRevoked:
      type: object
      additionalProperties: false
      required: [device_id, status]
      properties:
        device_id: { type: string }
        status: { type: string, enum: [revoked] }
    BackupConfig:
      type: object
      additionalProperties: false
      required:
        [configured, credentials_readable, interval_hours, retention_mode,
         daily_keep, weekly_keep, monthly_keep]
      properties:
        configured: { type: boolean }
        credentials_readable:
          type: boolean
          description: >-
            远端解不解得开存着的凭据。恢复之后是 false（主密钥不进备份）：configured
            仍为 true、端点/桶/前缀能预填，但 worker 一轮都不跑，凭据要重填一次。
        endpoint: { type: [string, "null"] }
        bucket: { type: [string, "null"] }
        region: { type: [string, "null"] }
        prefix:
          type: [string, "null"]
          description: >-
            对象键前缀。**不得落在 `a/` 之下**——那是附件的命名空间，`reconcile`
            会列举它来找孤儿对象，停在那里的备份会在每一次对账里被报成孤儿。
        access_key_hint:
          type: [string, "null"]
          description: 前四位 + **** + 后四位，够分辨两把密钥、不够猜出一把。
        updated_at: { type: [integer, "null"], minimum: 1 }
        interval_hours: { type: integer, minimum: 1 }
        retention_mode:
          type: string
          enum: [lifecycle, application]
          description: >-
            lifecycle（默认）= 应用一次 delete 都不发，过期交给桶上的生命周期规则，
            于是那把子账号密钥可以不带 DeleteObject，服务器被打穿也删不掉自己的备份；
            application = 应用自己按份数清理，需要 DeleteObject。
        daily_keep: { type: integer, minimum: 3 }
        weekly_keep: { type: integer, minimum: 0 }
        monthly_keep: { type: integer, minimum: 0 }
    BackupConfigUpdate:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, region, prefix, secret_id, secret_key]
      properties:
        endpoint: { type: string, minLength: 8, maxLength: 512 }
        bucket: { type: string, minLength: 3, maxLength: 128 }
        region: { type: string, minLength: 2, maxLength: 64 }
        prefix: { type: string, minLength: 1, maxLength: 128 }
        secret_id: { type: string, minLength: 8, maxLength: 256 }
        secret_key: { type: string, minLength: 8, maxLength: 512 }
        interval_hours: { type: integer, minimum: 1, maximum: 720 }
        retention_mode: { type: string, enum: [lifecycle, application] }
        daily_keep: { type: integer, minimum: 3, maximum: 3650 }
        weekly_keep: { type: integer, minimum: 0, maximum: 3650 }
        monthly_keep: { type: integer, minimum: 0, maximum: 3650 }
    BackupVerification:
      type: object
      additionalProperties: false
      required: [verified, can_delete, lifecycle_prefixes]
      properties:
        verified: { type: boolean }
        can_delete:
          type: boolean
          description: >-
            这把密钥能不能删对象。**false 不是缺陷**：推荐配置就是不给 DeleteObject。
            它与 retention_mode 必须配套——选了 application 却删不动，会静默堆积。
        lifecycle_prefixes:
          type: [array, "null"]
          items: { type: string }
          description: >-
            桶上配了过期规则的前缀。空数组 = provider 明说没有规则；
            **null = 问不到**（例如最小权限密钥没有 GetLifecycleConfiguration），
            那说明不了规则是否存在，不得当成"没有规则"。
    BackupRun:
      type: object
      additionalProperties: false
      required: [id, started_at, finished_at, status, backup_id, source_bytes, stored_bytes,
                 failure_code, verified]
      properties:
        id: { type: integer, minimum: 1 }
        started_at: { type: integer, minimum: 1 }
        finished_at: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [running, success, failed] }
        backup_id: { type: [string, "null"] }
        source_bytes: { type: [integer, "null"], minimum: 0 }
        stored_bytes: { type: [integer, "null"], minimum: 0 }
        failure_code:
          type: [string, "null"]
          description: 稳定代号，从来不是 provider 原话；不含路径、键或凭据。
        verified: { type: boolean }
        lifecycle_covered:
          type: [boolean, "null"]
          description: >-
            这一轮之后桶上的过期规则是否盖住了备份前缀。null = 没问（application
            模式）或问不到；只有 false 是「规则被删了」。
    BackupRunList:
      type: object
      additionalProperties: false
      required: [last_backup_at, last_backup_bytes, last_backup_status,
                 backup_retention_mode, backup_overdue, backup_lifecycle_covered, runs]
      properties:
        last_backup_at: { type: [integer, "null"], minimum: 1 }
        last_backup_bytes: { type: [integer, "null"], minimum: 0 }
        last_backup_status:
          type: string
          enum: [not_configured, never, running, success, failed, locked]
          description: >-
            locked = 配了、但远端解不开存着的凭据（恢复后主密钥不在了），一轮都跑不了；
            它压过账本里最近一轮的结论，因为那些成功是另一台机器的。
        backup_retention_mode: { type: [string, "null"], enum: [lifecycle, application, null] }
        backup_overdue:
          type: boolean
          description: >-
            连着两个周期没有成功备份，由远端自己判定——只有它知道自己的周期。
            未配置时为 false，那是另一件事（另一条 issue）。
        backup_lifecycle_covered:
          type: [boolean, "null"]
          description: >-
            最近一次成功之后桶上的过期规则是否盖住备份前缀。null = 不适用（application
            模式、还没成功过）或问不到；**只有 false 是「规则被删了、备份在闷头堆积」**。
        runs:
          type: array
          items: { $ref: "#/components/schemas/BackupRun" }
    BackupDownloadPart:
      type: object
      additionalProperties: false
      required: [name, size, sha256, stored_size, url]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 0 }
        sha256:
          type: string
          description: "**解压后**原库的 SHA-256；下载方按它核，不按 URL 那头的任何东西。"
        stored_size: { type: integer, minimum: 0 }
        url: { type: string, description: 短命只读链接，只对这一个对象有效。 }
    BackupDownload:
      type: object
      additionalProperties: false
      required: [backup_id, created_at, app_version, expires_in, parts, restore_notes]
      properties:
        backup_id: { type: string }
        created_at: { type: integer, minimum: 1 }
        app_version: { type: string }
        expires_in: { type: integer, minimum: 60, maximum: 3600 }
        parts:
          type: array
          items: { $ref: "#/components/schemas/BackupDownloadPart" }
        restore_notes:
          type: array
          items: { type: string }
          description: 恢复时代码替不了、必须由人做的那几件事，跟着清单走。
    WechatCleanupReadiness:
      type: object
      additionalProperties: false
      required:
        [conversation_id, keep_months, keep_cutoff, synced_until, suggested_end, pending,
         unuploadable, source_missing_count, local_media_bytes, remote_configured,
         sync_blocker, wechat_running]
      properties:
        conversation_id: { type: string }
        keep_months: { type: integer, enum: [1, 3, 6, 12] }
        keep_cutoff:
          type: string
          format: date
          description: 今天往前推 keep_months 个月（本地日期）。
        synced_until:
          type: string
          format: date
          description: 从最早起连续全部已同步的最后一天（本地日期）；没有缺口时为今天。
        suggested_end:
          type: string
          format: date
          description: min(keep_cutoff, synced_until)——建议在微信里选的结束日期。
        pending:
          type: object
          additionalProperties: false
          required: [messages, attachments, attachment_bytes, earliest_at]
          description: 建议范围（keep_cutoff 及以前）里还没同步、但同步能治的。
          properties:
            messages: { type: integer, minimum: 0 }
            attachments: { type: integer, minimum: 0 }
            attachment_bytes: { type: integer, minimum: 0 }
            earliest_at: { type: [integer, "null"], description: 最早一件的时刻（秒） }
        unuploadable:
          type: object
          additionalProperties: false
          required: [count, earliest_at, attachment_ids]
          description: 建议范围里同步也治不了的附件（做不出字节，或重传多次仍失败）。
          properties:
            count: { type: integer, minimum: 0 }
            earliest_at: { type: [integer, "null"] }
            attachment_ids:
              type: array
              maxItems: 20
              items: { type: string }
        source_missing_count:
          type: integer
          minimum: 0
          description: 微信里本来就没有源文件的附件数；清了也不损失，不挡。
        local_media_bytes:
          type: integer
          minimum: 0
          description: 这个会话图片 / 视频 / 文件里本机源文件还在的字节数（来自归档记录，不扫微信目录）。
        remote_configured: { type: boolean }
        sync_blocker:
          type: [string, "null"]
          enum: [remote_not_configured, import_stale, remote_unavailable, null]
          description: >-
            「先同步」现在跑不动的原因；null 表示跑得动（或没有要同步的）。import_stale：
            最近一次导入早于建议结束日期，微信里可能有聊记还没见过的消息，要先导入。
        wechat_running: { type: boolean }
    WechatCleanupDriveStep:
      type: string
      enum: [wait_login, open_settings, open_storage, open_chat_data, search, tick]
    WechatCleanupDrive:
      type: object
      additionalProperties: false
      required:
        [state, conversation_id, step, steps_done, stopped_at, reason, started_at, finished_at,
         hint_window]
      properties:
        state: { type: string, enum: [idle, running, completed, stopped] }
        conversation_id: { type: [string, "null"] }
        session_id: { type: [string, "null"], description: 本次操作标识；用于观察和取消的作用域 }
        account_id: { type: [string, "null"] }
        step:
          description: 正在做的那一步；completed 与 idle 时为 null。
          oneOf:
            - { $ref: "#/components/schemas/WechatCleanupDriveStep" }
            - { type: "null" }
        steps_done:
          type: array
          items: { $ref: "#/components/schemas/WechatCleanupDriveStep" }
        stopped_at:
          description: stopped 时停在哪一步。
          oneOf:
            - { $ref: "#/components/schemas/WechatCleanupDriveStep" }
            - { type: "null" }
        reason:
          type: [string, "null"]
          enum:
            [wechat_not_found, menu_not_found, settings_not_found, storage_button_not_found,
             overview_not_found, chat_data_button_not_found, manage_page_not_found,
             search_icon_not_found, not_found, duplicate, tick_unverified, not_foreground,
             near_destructive_label, line_break_in_text, crashed, cancelled, login_timeout, selection_unverified, null]
          description: >-
            停下的原因代号（稳定、可据此给出一句人话）。not_found：搜不到这个会话；duplicate：有同名会话，
            留给用户自己勾；not_foreground / near_destructive_label / line_break_in_text 是输入守卫拒绝了一次操作。
        started_at: { type: [integer, "null"] }
        finished_at: { type: [integer, "null"] }
        hint_window:
          type: boolean
          description: >-
            微信旁的浮窗开出来了没有（等待登录时也可打开）。false = 没有第二个窗口可开（浏览器兜底）
            或开失败，剩下两步的提示留在聊记的面板里。
    WechatCleanupObserved:
      type: object
      additionalProperties: false
      required: [range, start, end, type_ok, readable, seen_at]
      properties:
        range:
          type: string
          enum: [all, recent3m, custom, unknown]
          description: 时间下拉：全部时间 / 三个月内 / 自定义时间 / 没读到。
        start: { type: [string, "null"], format: date }
        end:
          type: [string, "null"]
          format: date
          description: 自定义时间的结束日期；applied 区分编辑值和已应用值，缓存最多两分钟。
        type_ok:
          type: [boolean, "null"]
          description: 类型下拉是不是「图片、视频、文件」；null = 没读到。
        readable: { type: boolean, description: 这一次有没有真的读到清理页或日期框 }
        seen_at: { type: [integer, "null"] }
        applied: { type: boolean, description: 是否实际读到了已应用的日期范围，编辑中的日期为 false }
        selection_ok: { type: [boolean, "null"], description: 本次会话名称与全局已选数量是否一致；null 表示无法核对 }
    BrowserBackupPolicy:
      type: object
      additionalProperties: false
      required: [endpoint, bucket, region, prefix, interval_hours]
      properties:
        endpoint: { type: string, minLength: 8, maxLength: 512 }
        bucket: { type: string, minLength: 3, maxLength: 128 }
        region: { type: string, minLength: 2, maxLength: 64 }
        prefix: { type: string, minLength: 1, maxLength: 128 }
        interval_hours: { type: integer, minimum: 1, maximum: 720 }
    BrowserManagementProof:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
        second_factor: { type: [string, "null"], maxLength: 128, writeOnly: true }
    BrowserManagementConfirmation:
      type: object
      additionalProperties: false
      required: [verified, expires_at]
      properties:
        verified: { type: boolean }
        expires_at: { type: integer }
    SharedBackupRequest:
      type: object
      additionalProperties: false
      properties:
        prefix: { type: string, minLength: 1, maxLength: 128, default: backup }
        interval_hours: { type: integer, minimum: 1, maximum: 720, default: 24 }
    CapabilityId:
      type: string
      enum:
        [wechat-decryption, source-scan, windows-keystore, onboarding,
         local-overview, local-conversations, local-search, local-stats,
         local-export, local-settings, media-cache, safe-unload, remote-stats, remote-export,
         incremental-sync, sync-health, archive-status, object-storage-config,
         attachment-view, remote-conversations, remote-search, feedback,
         password-login, totp, browser-session, device-revocation,
         presigned-url, object-storage-credentials, remote-backup,
         share, local-shares, remote-shares, wechat-cleanup, backup-management, pairing-code]
      description: >-
        能力词表，与 docs/local-remote-boundary.md 第 3 节的功能归属表一一对应。
        归属端与对应路由写在前端集中清单 frontend/src/lib/capabilities.ts 里，
        本枚举只固定名字，好让两端说的是同一件事。
    Capability:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: { $ref: "#/components/schemas/CapabilityId" }
        state:
          type: string
          enum: [available, not_configured, unsupported]
          description: >-
            available 可用；not_configured 属于本端但尚未配置，界面须出现、标明未配置
            并给出配置入口；unsupported 不属于本端，界面与路由都不得出现。
    DeploymentCapabilities:
      type: object
      additionalProperties: false
      required: [deployment, auth_state]
      properties:
        deployment: { type: string, enum: [local, remote] }
        auth_state:
          type: string
          enum: [not_required, anonymous, authenticated, uninitialized, reauth_required]
          description: >-
            本地端恒为 not_required。远程端未登录时为 anonymous，尚未跑过首次向导时为
            uninitialized；已登录但日常再认证已开启且本会话未解锁时为 reauth_required（PSU-2.213）。
            这三者都不带 capabilities——登录页与向导页渲染前就要知道端类型
            与该去哪一屏，但能力明细不能借这个端点泄露。
        capabilities:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/Capability" }
          description: >-
            只列本端自己认领的能力。未认证的远程端不返回本字段；调用方须把缺席
            当作「这一端没说它有」，而不是默认可用。
    Bootstrap:
      type: object
      additionalProperties: false
      required: [accounts, active_account_id, health]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountSummary" }
        active_account_id: { type: [string, "null"] }
        health: { type: string, enum: [ok, degraded, failed] }
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, avatar_ref]
      properties:
        id: { type: string }
        display_name: { type: string }
        avatar_ref:
          description: >-
            本账号自己的头像资源引用。归档里没有本账号的头像时为 null——
            微信的通讯录并不保证存下账号本人的头像地址。
          type: [string, "null"]
        source_label:
          type: string
          description: 安全的次要来源标签，可为裁剪后的来源名或原账号标签，绝不含完整本地路径
    RemoteArchiveStatus:
      type: object
      additionalProperties: false
      required: [configured, archive_id]
      properties:
        configured: { type: boolean }
        archive_id:
          type: [string, "null"]
          description: 非敏感不透明归档标识；未配置时为 null
    IssuedPairingCode:
      type: object
      additionalProperties: false
      required: [pairing_code, expires_at]
      properties:
        pairing_code:
          type: string
          minLength: 1
          description: >-
            要送去下一台机器的那个秘密，形如 `<id>.<hex>`。它是这个流程里唯一
            **应该**离开本机的秘密；界面显示它，日志一个字都不许带。
        expires_at:
          type: integer
          description: >-
            Unix 秒。界面据此倒计时——过期后服务端只会答一个笼统的
            `PAIRING_CODE_INVALID`，分不出「抄错了」还是「太慢了」。
    PairingRequest:
      type: object
      additionalProperties: false
      required: [base_url, pairing_code, device_name]
      properties:
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: 远端归档地址；必须是 https（回环 http 例外），否则令牌会明文上路
        pairing_code: { type: string, minLength: 1, maxLength: 512 }
        device_name: { type: string, minLength: 1, maxLength: 128 }
    PairedDevice:
      type: object
      additionalProperties: false
      required: [archive_id, device_id, base_url]
      properties:
        archive_id: { type: string, minLength: 1 }
        device_id: { type: string, minLength: 1 }
        base_url:
          type: string
          minLength: 1
          description: 规范化之后真正存下来的地址，可能与请求里那个不逐字相同
    RemoteConversationSummary:
      type: object
      additionalProperties: false
      required:
        [conversation_id, message_count, last_created_at, last_server_sequence,
         display_name, is_group, last_message_type, last_message_preview,
         avatar_blob_id, announcement, my_group_alias, member_count]
      properties:
        conversation_id: { type: string }
        message_count: { type: integer, minimum: 0 }
        last_created_at: { type: integer }
        last_server_sequence: { type: integer, minimum: 0 }
        display_name:
          type: [string, "null"]
          description: >-
            会话名称。**null 表示会话流还没把名字送到这个远端**（远端停在 v1，
            或全量重传尚未跑完），此时界面显示不透明标识并说明原因，不拿消息
            内容凑一个名字。名称走独立的会话流，不是每条消息上的副本——改了名
            之后旧副本无法收敛。
        is_group: { type: [boolean, "null"] }
        source_account_id:
          type: [string, "null"]
          description: >-
            独占这条会话的那一个账号（记录模型 v3，PSU-2.35a）。**可选**：
            远端不到 v3 时整个键缺席；null 表示合并行或未归属，两者界面都
            不该派给谁。带账号过滤查询时恒为过滤值。
        last_message_type:
          type: [string, "null"]
        last_message_preview:
          type: [string, "null"]
          description: >-
            会话列表那一行显示的「最后一条消息」（记录模型 v6，PSU-2.44）。
            **null 兼指两件事**：远端到不了 v6，或这条会话没有可预览的消息——
            界面两种都退回「N 条消息」，本来就是同一句话。文案口径与本机档案
            共用一份（后端 `domain/preview`）；远程归档里没有附件文件名，
            所以文件消息是 `[文件]` 而不带名字。
        avatar_blob_id:
          type: [string, "null"]
          description: >-
            这条会话头像的 blob 标识（记录模型 v8，PSU-2.47）。**null 兼指**
            远端到不了 v8、通讯录还没发布、以及本机压根没有这张图的地址——
            群与单聊走**同一条路**：微信把群本身也存成一条联系人
            （`<数字>@chatroom`），所以群头像的地址与人的并排放在
            `contacts.avatar_source_url` 里，本机取群头像也正是这么取的。
            三种情况界面都退回首字母，并由 ⓘ 说明是「还没上传」而不是
            「不可用」。取字节走 `/api/v1/remote/attachments/{blob_id}/url`，
            与附件同一条路。
        announcement:
          type: [string, "null"]
          description: 群公告（记录模型 v8）。null = 没被告知或没有公告
        my_group_alias:
          type: [string, "null"]
          description: 我在这个群里的昵称（记录模型 v8）
        member_count:
          type: [integer, "null"]
          minimum: 0
          description: >-
            成员数。**没有名单时是 null 不是 0**——0 会声称「这个群是空的」，
            而没有群是空的。列表行上恒为 null（只有详情读会去数）。
    RemoteConversationMember:
      type: object
      additionalProperties: false
      required: [member_uid, display_name, group_alias, is_self, avatar_blob_id]
      properties:
        member_uid: { type: string }
        display_name:
          type: string
          description: >-
            成员在这个群里显示的名字。可以是空串——那是「上行过、但源里就是空的」，
            与「这个人不在名单里」不同，界面据此显示不透明标识而不是漏掉这一行。
        group_alias: { type: [string, "null"] }
        is_self: { type: boolean }
        avatar_blob_id: { type: [string, "null"] }
    RemoteConversationMembersPage:
      type: object
      additionalProperties: false
      description: >-
        一页群成员（记录模型 v8，PSU-2.47）。空的 items 是真实答案：这条会话的
        名单还没发布过。远端根本没有名单这个概念时这条路答 QUERY_INVALID，
        所以读的人看到空名单可以放心照它说的画。
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteConversationMember" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    RemoteAccountsPage:
      type: object
      additionalProperties: false
      description: >-
        远程归档的账号维度（记录模型 v3，PSU-2.35a）。未归属 = 该行的归属批次
        早于账号作用域化、流无法证明——这些行属于没有人，在任何账号的过滤视图
        里都不出现，所以计数必须单独说出来，不能让它们消失得像不存在。
      required: [items, unattributed_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteAccountSummary" }
        unattributed_count: { type: integer, minimum: 0 }
    RemoteAccountSummary:
      type: object
      additionalProperties: false
      required:
        [source_account_id, record_count, display_name, avatar_blob_id,
         merged_source_account_ids]
      properties:
        source_account_id: { type: string, minLength: 1 }
        record_count: { type: integer, minimum: 0 }
        display_name:
          type: [string, "null"]
          description: >-
            这个账号自己报的名字（记录模型 v5，PSU-2.40）。null 表示这条上传流
            还没送过名字——远端到不了 v5，或者那台采集机在 v5 之前就不再同步了。
            界面据此显示不透明标识并说明原因，不从记录里凑一个名字出来。
        avatar_blob_id:
          type: [string, "null"]
          description: >-
            这个账号自己的头像（记录模型 v10，PSU-2.55）。与名字同一个来源：
            采集端按同一次推导挑出「哪一个身份是我」，把头像台账里那份字节的
            标识一起送上来，远端不再自己推一遍。null 兼指「远端/采集机到不了
            v10」与「这个账号本来就没有头像」——两者在界面上是同一件事，印
            首字母，不摆一个取不到字节的 <img>。取字节与附件同一条路（预签名
            URL），所以这一端没配对象存储时它同样取不到。
        merged_source_account_ids:
          type: array
          items: { type: string, minLength: 1 }
          description: >-
            同一个微信的其它上传流 id——这个账号「以前还叫过什么」（记录模型 v11，
            PSU-2.86 归并 / PSU-2.90 报出）。两台机器采集同一个微信会给出两个上传流
            id，归并之后只剩 primary 出现在这份列表里；归并之前存下的书签与深链
            带的是另一个 id，客户端拿这一列把 URL 换过来。
            **空数组不是 null**：这里没有「不知道」这一档，一条流要么有同伴要么没有
            （远端到不了 v11 时同样是空数组——读侧结论相同：URL 上的 id 不用换）。
    RemoteConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteConversationSummary" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    RemoteMessage:
      type: object
      additionalProperties: false
      description: >-
        远程一条消息的浏览视图（PSU-2.30 扩宽）。渲染字段一律出现，值可以是
        null——**null 是「远端没被告知过」，不是「空」**：v1 远端、或全量重传
        还没走到的记录，都读作 null，界面据此如实说明而不是编一个发送者。
        仍然不含 `content_sha256` 与任何本地定位字段：前者是同步链路的校验值，
        对读没有用处，只会把一份内容指纹散到浏览器上。
      required:
        [record_key, conversation_id, created_at, content_text, server_sequence,
         sender_uid, sender_display_name, is_self, message_type, app_card_json,
         reply_to_key, attachment_refs]
      properties:
        record_key: { type: string, minLength: 1 }
        conversation_id: { type: string }
        created_at: { type: integer }
        content_text: { type: string }
        server_sequence: { type: integer, minimum: 1 }
        sender_uid: { type: [string, "null"] }
        sender_display_name: { type: [string, "null"] }
        is_self: { type: [boolean, "null"] }
        message_type:
          type: [string, "null"]
          description: >-
            发送端记录的消息类型。刻意**不**收敛到本地 `MessageType` 枚举：
            远端存的是上传当时的字符串，把一个没见过的值硬映射成 unknown 会
            抹掉「这个远端说了什么」这条事实。界面认得的照类型渲染，认不得的
            如实标注。
        app_card_json: { type: [string, "null"] }
        reply_to_key:
          type: [string, "null"]
          description: 被引用消息的 record_key；远端不一定持有那条记录
        attachment_refs:
          type: array
          items: { type: string }
          description: >-
            该消息附件的 blob 标识（PSU-2.31 起才会非空）。空数组同时覆盖
            「没有附件」与「远端没被告知过附件」两种情况——浏览器不需要区分，
            两者都不该出现附件入口。
        source_account_id:
          type: [string, "null"]
          description: >-
            这条记录归哪条上传流（记录模型 v3，PSU-2.35a）。**可选**：远端
            不到 v3 时整个键缺席；null = 未归属（归属批次早于账号作用域化），
            不是「没有账号」。
        sender_avatar_blob_id:
          type: [string, "null"]
          description: >-
            发送者头像的 blob 标识（记录模型 v8，PSU-2.47）。**读时接上的**，
            不是冻在这条记录里的副本——人会换头像，冻住的那份会永远是旧的。
            刻意**不**混进 `attachment_refs`：那是一列无类型的 blob 标识，
            塞进去会被当成这条消息的附件渲染出来。
        transcript:
          description: >-
            这条语音的机器转写（记录模型 v13，PSU-2.163）。**可选**：远端到不了
            v13 时整个键缺席。null 三义合一：这条不是语音、本机还没把转写发给
            这个远端、或者这个远端没有这一版——界面对三者的动作相同：不画那一行。
            比本地 `VoiceTranscript` 少 `status` 与 `failure_code`，因为远端只
            存得下转成功的那些；补齐成本地形状是 `remoteReadModel` 的事。
          oneOf:
            - { $ref: "#/components/schemas/RemoteVoiceTranscript" }
            - { type: "null" }
        reply_preview:
          description: >-
            同归档、同账号、同会话的被引消息最小预览；跨页也返回附件引用。
            可选，老远端缺席；缺失原消息或不匹配作用域时为 null。不递归读取引用。
          oneOf:
            - { $ref: "#/components/schemas/RemoteReplyPreview" }
            - { type: "null" }
    RemoteReplyPreview:
      type: object
      additionalProperties: false
      required: [record_key, sender_display_name, content_text, message_type, attachment_refs]
      properties:
        record_key: { type: string, minLength: 1 }
        sender_display_name: { type: [string, "null"] }
        content_text:
          type: string
          maxLength: 40
          description: 被引消息在引用条上显示的正文摘要，不返回完整长正文。
        message_type: { type: [string, "null"] }
        attachment_refs:
          type: array
          items: { type: string }
    RemoteVoiceTranscript:
      type: object
      additionalProperties: false
      required: [text, engine, low_confidence]
      properties:
        text: { type: string, minLength: 1 }
        engine:
          type: string
          description: >-
            哪个引擎写的，如 `tencent:16k_zh_en_2.0`。界面不显示它，但远端是
            多台机器的转写汇合处，"最后赢的是哪一版"只能从这里读出来。
        low_confidence: { type: boolean }
    RemoteMessagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteMessage" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    RemoteMessageWindow:
      type: object
      additionalProperties: false
      required: [items, anchor_message_id]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteMessage" }
        anchor_message_id: { type: string }
    RemoteAttachmentUrl:
      type: object
      additionalProperties: false
      description: >-
        一次性的附件读取授权。URL 在有效期内**就是**那个附件——它不认证任何人，
        所以有效期短，且不该被记进日志或长期缓存。
      required: [url, method, expires_at, storage_origin]
      properties:
        url: { type: string, minLength: 1 }
        method: { type: string, enum: [GET] }
        expires_at:
          type: integer
          minimum: 1
          description: Unix 秒。过期只拦「开始下载」，已在传输中的不会被切断
        storage_origin:
          type: string
          minLength: 1
          description: >-
            URL 指向的 scheme+host。单独给出来，页面就不必去拆那个签名 URL
            （签名在它的 query string 里）。也是 CSP 里 img-src/connect-src
            必须放行的那个 origin。
    RemoteThumbnailUrl:
      type: object
      additionalProperties: false
      description: >-
        缩略图的一次性读取授权，外加原图的可得性。与 `RemoteAttachmentUrl`
        同样的四个字段，多一个 `original_available`——同一次往返里回答两个问题，
        因为页面为了画气泡本来就要发这一条。
      required: [url, method, expires_at, storage_origin, original_available]
      properties:
        url: { type: string, minLength: 1 }
        method: { type: string, enum: [GET] }
        expires_at:
          type: integer
          minimum: 1
          description: Unix 秒。过期只拦「开始下载」，已在传输中的不会被切断
        storage_origin:
          type: string
          minLength: 1
          description: URL 指向的 scheme+host，与 `RemoteAttachmentUrl` 同义
        original_available:
          type: boolean
          nullable: true
          description: >-
            原图在远端取不取得到。`false` 是**永久**状态（原图从未上行，本机
            的副本早被配额淘汰），界面应当标「仅缩略图」并且**不要**说「请重试」。

            **`null` 是「问不出来」不是「没有」**：缩略图签出来了，但复核原图
            那一步自己失败了（远端抖动等）。把它当成 `false` 就会因为一次瞬时
            故障宣布一张图永久丢失，所以界面在这一档要按「未知」渲染——照常显示
            缩略图，不标「仅缩略图」，也不给「查看原图」入口。
    RemoteSearchPage:
      type: object
      additionalProperties: false
      description: >-
        一页远程搜索结果（记录模型 v7 起扩宽，PSU-2.45）。除 items 外的键**一律
        出现**，值说明这一端到底能答出什么：`index_status = unavailable` 就是
        「这个远端还没有索引」，`building` 是「还在建，这一份可能不完整」。
        没有总数的「100 条结果」读起来像「一共 100 条」，而它其实只是「上限 100」
        ——所以总数不是装饰。
      required:
        [items, next_cursor, has_more, total_count, conversation_counts, index_status]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RemoteMessage" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
        total_count: { type: integer, minimum: 0 }
        conversation_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        index_status:
          type: string
          enum: [ready, building, unavailable]
    ConversationSummary:
      type: object
      additionalProperties: false
      required:
        [id, display_name, is_group, last_message_at, last_message_type,
         last_message_preview, message_count, media_count]
      properties:
        id: { type: string }
        display_name: { type: string }
        is_group: { type: boolean }
        last_message_at: { type: [integer, "null"] }
        last_message_type:
          description: Type of the newest archived message; null for an empty conversation.
          anyOf:
            - { $ref: "#/components/schemas/MessageType" }
            - { type: "null" }
        last_message_preview:
          description: >-
            Truthful, bounded preview of the newest archived message. Media and
            attachment messages use a type label; null for an empty conversation.
          type: [string, "null"]
        message_count: { type: integer }
        media_count: { type: integer }
        avatar_ref:
          description: Opaque avatar resource reference. Null when the source has no avatar.
          type: [string, "null"]
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationSummary" }
        next_cursor: { type: [string, "null"] }
    ContactDirectoryEntry:
      type: object
      additionalProperties: false
      required: [contact_uid, display_name, avatar_ref, has_display_name]
      properties:
        contact_uid:
          description: 与搜索的 `sender_id` 参数同一个标识，选中即可直接筛。
          type: string
        display_name: { type: string }
        avatar_ref: { type: [string, "null"] }
        has_display_name:
          description: >-
            false = 归档里没有这个人的名字，`display_name` 就是那串 uid 本身
            （真实归档 2,605 行里有 813 行如此）。界面据此弱化显示，不编称呼。
          type: boolean
    ContactDirectoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContactDirectoryEntry" }
        next_cursor: { type: [string, "null"] }
    ContactSummary:
      type: object
      additionalProperties: false
      required:
        [id, display_name, remark, avatar_ref, signature, source_description,
         added_at, is_unknown]
      properties:
        id: { type: string }
        display_name: { type: string }
        remark: { type: [string, "null"] }
        avatar_ref: { type: [string, "null"] }
        signature: { type: [string, "null"] }
        source_description: { type: [string, "null"] }
        added_at: { type: [integer, "null"] }
        is_unknown: { type: boolean }
    ConversationDetail:
      allOf:
        - { $ref: "#/components/schemas/ConversationSummary" }
        - type: object
          additionalProperties: false
          required: [announcement, my_group_alias, member_count, contact]
          properties:
            announcement: { type: [string, "null"] }
            my_group_alias: { type: [string, "null"] }
            member_count: { type: integer, minimum: 0 }
            contact:
              anyOf:
                - { $ref: "#/components/schemas/ContactSummary" }
                - { type: "null" }
    ConversationMember:
      type: object
      additionalProperties: false
      required: [id, display_name, group_alias, contact_id, is_self, is_unknown]
      properties:
        id: { type: string }
        display_name: { type: string }
        group_alias: { type: [string, "null"] }
        contact_id: { type: [string, "null"] }
        is_self: { type: boolean }
        is_unknown: { type: boolean }
        avatar_ref:
          description: Opaque avatar resource reference. Null when the source has no avatar.
          type: [string, "null"]
    ConversationMemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationMember" }
        next_cursor: { type: [string, "null"] }
    ReplyPreview:
      type: object
      additionalProperties: false
      required:
        [message_id, sender_display_name, content_text, message_type, attachments]
      properties:
        message_id: { type: string }
        sender_display_name: { type: [string, "null"] }
        content_text: { type: string }
        message_type:
          type: string
          enum: [text, image, audio, video, file, link, quote, emoji, app, system, unknown]
        attachments:
          description: >-
            The quoted message's own attachments, the same rows that message
            carries when it is itself in the page. WeChat leaves a reply with
            nothing but a placeholder word for what it quotes ("[图片]"), so
            without these a quoted picture can only ever be shown as text.
            Empty when the quoted message has no attachments, and when the
            quoted message is not in this archive there is no preview at all.
          type: array
          items: { $ref: "#/components/schemas/AttachmentSummary" }
    AppCardItem:
      type: object
      additionalProperties: false
      required:
        [sender, created_at, kind, text, nested, file_name, file_size,
         file_format, source_desc, full_md5, thumb_md5, attachment_id]
      properties:
        sender: { type: [string, "null"] }
        avatar_url:
          description: Optional allowlisted HTTPS sender avatar reference; absent on older cards.
          type: [string, "null"]
        avatar_ref:
          description: Optional account-scoped local avatar endpoint, derived only on the local read side.
          type: [string, "null"]
        avatar_blob_id:
          description: Optional existing uploaded avatar object matched by account, archive and exact source URL.
          type: [string, "null"]
        reply:
          description: Optional structured reply preserved from the forwarded item.
          anyOf:
            - { $ref: "#/components/schemas/AppCard" }
            - { type: "null" }
        created_at: { type: [integer, "null"] }
        kind:
          description: >-
            What the item is. "unknown" is the parser declining to guess a
            datatype it cannot confirm, not a decoding failure.
          type: string
          enum: [text, image, video, voice, link, file, record, sticker, unknown]
        text: { type: [string, "null"] }
        nested:
          anyOf:
            - { $ref: "#/components/schemas/AppCard" }
            - { type: "null" }
        file_name:
          description: The forwarded item's own filename, when it has one.
          type: [string, "null"]
        file_size:
          description: >-
            Size in bytes of the item's payload as the forwarding client
            recorded it. Present for files and usually for images and videos;
            never fetched or recomputed here.
          type: [integer, "null"]
        file_format:
          description: Format token as written in the source (xlsx, docx, mp4 …).
          type: [string, "null"]
        source_desc:
          description: >-
            The qualifier WeChat renders after the sender's name, e.g. the
            enterprise a WeCom contact belongs to.
          type: [string, "null"]
        full_md5:
          description: >-
            The forwarded item's full-size content hash (lowercase hex) as
            WeChat's recordinfo records it. Used to locate the item's bytes in
            WeChat's local cache and to derive attachment_id. null for items
            carrying no media.
          type: [string, "null"]
        thumb_md5:
          description: >-
            The forwarded item's thumbnail content hash (lowercase hex). null
            when the item has no thumbnail or carries no media.
          type: [string, "null"]
        attachment_id:
          description: >-
            The archive attachment this media item resolves to, derived
            deterministically from the message id, kind and content hash. A
            reader looks it up in the owning message's attachments array. May be
            present while no such attachment exists yet (an end that holds the
            record but not the bytes) -- treat a miss as "not available here",
            not an error. null for items carrying no media.
          type: [string, "null"]
        remote_media:
          description: Verified media association on record-model v14; absent on local source cards and older targets.
          anyOf:
            - $ref: "#/components/schemas/ForwardMediaRef"
            - { type: "null" }
    ForwardMediaRef:
      type: object
      additionalProperties: false
      required: [blob_id, variant, size, sha256]
      properties:
        blob_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$" }
        variant: { type: string, enum: [original, thumbnail] }
        size: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    AppCard:
      type: object
      additionalProperties: false
      required:
        # 这里缺的五个（cover_url / avatar_url / duration_seconds /
        # media_width / media_height）是**有意的例外**，见下面的注释与
        # test_app_card_contract.py 里那份具名豁免。
        [kind, title, subtitle, source_name, url, items, item_total,
         truncated, quoted, transfer_amount, transfer_memo, transfer_status,
         transfer_time, transfer_settled_at, transfer_payer_uid,
         transfer_payee_uid, transfer_sender_role, packet_greeting,
         packet_scene, packet_cover, packet_sender_action,
         packet_receiver_action, packet_exclusive, packet_expires_at]
      properties:
        kind:
          type: string
          enum: [merged_forward, link, image, voice, video, miniprogram, channel,
                 location, business_card, voip, file, quote, transfer, redpacket,
                 group_payment, pat, card]
        title: { type: string }
        subtitle: { type: [string, "null"] }
        source_name: { type: [string, "null"] }
        cover_url:
          description: Optional HTTP/HTTPS source cover URL for a video-channel share, not an archived attachment.
          type: [string, "null"]
        avatar_url:
          description: Optional HTTP/HTTPS video-channel author avatar URL.
          type: [string, "null"]
        duration_seconds: { type: [integer, "null"], minimum: 1 }
        media_width: { type: [integer, "null"], minimum: 1 }
        media_height: { type: [integer, "null"], minimum: 1 }
        url:
          description: Present only for http/https URLs; other schemes are dropped.
          type: [string, "null"]
        items:
          description: >-
            The items that fit within the stored size cap. Compare with
            item_total to know how many are missing.
          type: array
          items: { $ref: "#/components/schemas/AppCardItem" }
        item_total:
          description: >-
            How many items the card really had, not how many survived the size
            cap.
          type: integer
        truncated:
          description: >-
            This card is not complete. It covers three different losses:
            items dropped for the size cap (items.length < item_total), a
            nested record left unexpanded at the depth limit, and long text
            fields clipped. Only the first has a countable difference, so a
            renderer must not assume item_total - items.length > 0.
          type: boolean
        quoted:
          description: >-
            For kind "quote": the quoted message parsed as a card of its own,
            present only when the quoted message was itself a card (a forwarded
            record, a file, a link, another quote). null otherwise — subtitle
            already carries the whole of what the source says about prose and
            media. subtitle stays authoritative for one-line rendering either
            way.
          anyOf:
            - { $ref: "#/components/schemas/AppCard" }
            - { type: "null" }
        transfer_amount:
          description: Source-formatted transfer amount, including its currency symbol.
          type: [string, "null"]
        transfer_memo:
          description: Transfer memo as recorded in the source message.
          type: [string, "null"]
        transfer_status:
          description: >-
            Confirmed transfer state. Every WeChat transfer writes a paysubtype
            1 message when it is started and, if it is settled, a second
            message carrying the same transcationid: 3 when the receiver takes
            the money, 4 when it goes back. A started transfer with no settling
            message yet is pending; a settled one carries the settled state on
            both halves of the pair. unknown stays required for any paysubtype
            without locally verified semantics.
          type: [string, "null"]
          enum: [received, pending, refunded, unknown, null]
        transfer_time:
          description: >-
            When the transfer was started, from the source begintransfertime
            field, in seconds since the epoch. This is not the message time:
            the settling message carries the original start time as well.
          type: [integer, "null"]
        transfer_settled_at:
          description: >-
            When the transfer reached transfer_status, in seconds since the
            epoch — the received or refunded time. Taken from the settling
            message's own timestamp because the source records no such field.
            null while a transfer is pending or its state is unknown.
          type: [integer, "null"]
        transfer_payer_uid:
          description: >-
            Who the source itself names as paying, from wcpayinfo/payer_username.

            null means the source did not name this side, and that is not an
            ambiguity: transfer_status already says which side the message's own
            sender is on. A pending transfer is the started half, which the
            payer sends; a received or refunded one is the settling half, which
            the payee sends. In a one-to-one chat the other side is the person
            the conversation is with; in a group the source either names them
            here or this archive does not know.

            A uid, never a name. Names are resolved when the card is read, for
            the same reason an avatar is: people rename themselves, and a copy
            frozen onto a 2019 transfer would stay wrong forever. It is also
            what keeps a replay from stored bytes able to re-derive the field
            without reading the WeChat installation.
          type: [string, "null"]
        transfer_payee_uid:
          description: >-
            Who the source itself names as being paid, from
            wcpayinfo/receiver_username — but only where that field means it.

            Measured over 1126 transfer messages on one machine: when
            payer_username is filled (every group transfer, 183 messages) the
            two are a matching pair. On the started half of a one-to-one
            transfer receiver_username is the addressee, which is the payee
            (266/266). On the settling half it is the addressee of a message
            travelling back the other way — the payer — and in 18 of 672 it is
            the sender's own id instead. So that half names neither party here,
            rather than naming the wrong one.
          type: [string, "null"]
        transfer_sender_role:
          description: >-
            Which side of the transfer wrote this message, from the source
            paysubtype: the started half (1) is written by the payer, the
            settling half (3 received, 4 refunded) by the payee.

            Carried as its own field, and deliberately not re-derivable from
            transfer_status: once a pair settles, the started half is promoted
            to the settled state too, so both halves report "received" while
            their senders stay on opposite sides. A reader that inferred the
            role from the status would read every settled sender's row exactly
            backwards.

            This is what orients a one-to-one transfer, where the source names
            only one of the two parties — and the only thing that orients the
            started messages whose source names neither.

            null when the paysubtype has no locally verified meaning, which is
            the same set transfer_status calls unknown.
          type: [string, "null"]
          enum: [payer, payee, null]
        packet_greeting:
          description: >-
            For kinds "redpacket" and "group_payment": the blessing WeChat
            prints on the packet, from the source receivertitle (which equalled
            sendertitle in every message measured). title carries the same
            string, so a renderer that only draws title loses nothing.
          type: [string, "null"]
        packet_scene:
          description: >-
            The source scenetext — 微信红包, 活动账单, 群收款 — the label
            WeChat draws under the blessing.
          type: [string, "null"]
        packet_cover:
          description: >-
            The custom cover's owner, from the source corpname. null for a
            packet wearing the default cover.
          type: [string, "null"]
        packet_sender_action:
          description: >-
            The source senderdes: what the packet offers the person who sent it
            (查看红包). A group bill writes its per-person amount into this
            field and into packet_receiver_action alike, and that line is the
            only place the amount is recorded at all.
          type: [string, "null"]
        packet_receiver_action:
          description: The source receiverdes; 领取红包 for a red packet.
          type: [string, "null"]
        packet_exclusive:
          description: >-
            A 专属红包 — the source names a single group member as its
            recipient. The name itself is not carried onto the card.
          type: boolean
        packet_expires_at:
          description: >-
            The source invalidtime, in seconds since the epoch: when the packet
            stops being openable.

            There is deliberately no field for whether it *was* opened, and
            none for the amount. Neither is a gap in the parsing: the message
            carries no amount at all (a transfer carries feedesc; a red packet's
            amount is hidden until it is opened), every paymsgid measured
            occurred exactly once, and no 领取 notice reaches this archive.

            Nor are they elsewhere on disk. WeChat's own general.db keeps a
            redEnvelopeTable whose nine columns include hb_status and
            receive_status but no amount column of any kind — and it held one
            row for the account that sent 368 red packets, because it is a
            short-lived UI cache rather than a ledger. transferTable is the
            same: rows, times, payer and receiver, no amount. Both figures live
            on WeChat's servers, which its client re-fetches every time the
            detail page opens.
          type: [integer, "null"]
    MessageSummary:
      type: object
      additionalProperties: false
      required:
        [id, conversation_id, sender_uid, sender_display_name, created_at,
         message_type, content_text, is_self, reply_to_id, parse_status,
         attachments, reply_preview, app_card, transcript]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        sender_uid: { type: string }
        sender_display_name: { type: [string, "null"] }
        sender_avatar_ref:
          description: Opaque avatar resource reference for the sender.
          type: [string, "null"]
        created_at: { type: integer }
        message_type:
          type: string
          enum: [text, image, audio, video, file, link, quote, emoji, app, system, unknown]
        content_text: { type: string }
        is_self: { type: [boolean, "null"] }
        reply_to_id: { type: [string, "null"] }
        parse_status: { type: string, enum: [parsed, partial, unsupported] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentSummary" }
        reply_preview:
          anyOf:
            - { $ref: "#/components/schemas/ReplyPreview" }
            - { type: "null" }
        app_card:
          description: >-
            The structured card parsed from this message's raw XML, or null
            when there is none. Always additive: message_type and the
            attachment fields describe the message with or without it.
          anyOf:
            - { $ref: "#/components/schemas/AppCard" }
            - { type: "null" }
        transcript:
          description: >-
            What a machine heard in this message's voice recording, or null
            when nothing has been transcribed. Never merged into content_text:
            the archived record must not be polluted by what a machine wrote,
            and the interface must be able to label it as machine-written.
          anyOf:
            - { $ref: "#/components/schemas/VoiceTranscript" }
            - { type: "null" }
    VoiceTranscript:
      type: object
      additionalProperties: false
      required: [text, status, engine, low_confidence, failure_code]
      properties:
        text:
          description: Empty unless status is ok.
          type: string
        status:
          description: >-
            ok carries text. empty means the engine ran and heard nothing --
            a real outcome for a very quiet recording, and a different thing
            from never having tried. failed means the attempt did not land.
          type: string
          enum: [ok, empty, failed]
        engine:
          description: Which engine wrote it, e.g. tencent:16k_zh_en_2.0.
          type: string
        low_confidence:
          description: >-
            The engine was unsure. Shown to the reader as "may be wrong"
            rather than hidden, and still searchable.
          type: boolean
        failure_code: { type: [string, "null"] }
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MessageSummary" }
        next_cursor: { type: [string, "null"] }
    MessageWindow:
      type: object
      additionalProperties: false
      required: [items, anchor_message_id]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MessageSummary" }
        anchor_message_id: { type: string }
    MessageType:
      type: string
      enum: [text, image, audio, video, file, link, quote, emoji, app, system, unknown]
    SearchHit:
      type: object
      additionalProperties: false
      required:
        [message_id, conversation_id, source_account_id, sender_uid,
         sender_display_name, message_type, has_attachment, created_at, snippet,
         attachment_file_name, is_self]
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        source_account_id: { type: string }
        sender_uid: { type: string }
        sender_display_name: { type: [string, "null"] }
        message_type: { $ref: "#/components/schemas/MessageType" }
        has_attachment: { type: boolean }
        created_at: { type: integer }
        snippet: { type: string }
        attachment_file_name: { type: [string, "null"] }
        is_self: { type: boolean }
        sender_avatar_ref:
          description: Opaque avatar resource reference for the sender; null when unavailable.
          type: [string, "null"]
        attachment_id:
          description: First archived attachment associated with the hit; null when absent.
          type: [string, "null"]
        attachment_kind:
          description: First attachment kind when the message has an attachment.
          type: [string, "null"]
          enum: [image, emoji, audio, video, file, unknown, null]
        attachment_mime_type: { type: [string, "null"] }
        attachment_size:
          description: >-
            Byte size of the first attachment as recorded in the archive; null when
            the source never recorded one.
          type: [integer, "null"]
          minimum: 0
        attachment_cache_status:
          description: Current local cache status of the first attachment.
          type: [string, "null"]
        attachment_variant:
          description: Stored media variant, such as thumbnail.
          type: [string, "null"]
        attachment_content_available: { type: boolean }
    MessageDaysPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    StorageReclaimRequest:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string }
        confirm:
          description: 执行端点必须为 true；预览忽略此字段。
          type: boolean
          default: false
    StorageReclaimPreview:
      type: object
      additionalProperties: false
      description: >-
        `fits` 为 false 时不要开始：`VACUUM` 要把整个库重写一遍，磁盘至少还得放得下
        第二份，中途 ENOSPC 会留下一个半写的临时文件和一个没缩的库。
      required:
        [outbox_row_count, upload_batch_count, media_item_count, media_bytes,
         database_bytes, free_bytes, fits, blocked_by]
      properties:
        outbox_row_count: { type: integer, minimum: 0 }
        upload_batch_count: { type: integer, minimum: 0 }
        media_item_count: { type: integer, minimum: 0 }
        media_bytes: { type: integer, minimum: 0 }
        database_bytes: { type: integer, minimum: 0 }
        free_bytes: { type: integer, minimum: 0 }
        fits: { type: boolean }
        blocked_by:
          description: >-
            占着写入、因而挡住回收的那个导入作业，没有就是 null。**不是「有导入在跑」**：
            `paused` 与 `interrupted` 的作业握着还打算续用的检查点，同样要挡，
            而界面必须能把「正在导入」与「有个暂停的导入挡着」分开说——真机上挡了三个
            星期的那一个就是后者（PSU-2.89）。挡路的可能不止一个，这里给最早建的那条。
          anyOf:
            - { $ref: "#/components/schemas/ReclaimBlockingJob" }
            - { type: "null" }
    ReclaimBlockingJob:
      type: object
      additionalProperties: false
      description: >-
        挡路作业的只读投影。刻意不含 `checkpoint` 与 `task_spec`——那是作业的内部状态，
        没有理由为了显示一句提示发到界面上。
      required: [job_id, source_account_id, status, stage, updated_at]
      properties:
        job_id: { type: string }
        # 谓词是全局的：挡路的作业可能属于**另一个**账号，那时界面不能把人送去一个
        # 按当前账号过滤的空列表。
        source_account_id: { type: string }
        status:
          type: string
          enum: [queued, running, pausing, paused, interrupted]
        stage: { type: [string, "null"] }
        updated_at: { type: integer }
    SearchIndexRequest:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string }
    SearchIndexState:
      type: object
      additionalProperties: false
      description: >-
        检索索引此刻的样子。`pending_message_count` 是**还没进索引的消息条数**，
        用来在开启前如实告诉用户这一步要做多少事；关闭时它就是全部可检索消息数
        ——正是再次开启要做的事。
      required:
        [status, indexed_message_count, pending_message_count,
         estimated_index_bytes]
      properties:
        status:
          type: string
          enum: [ready, building, unavailable, not_initialized]
        indexed_message_count: { type: integer, minimum: 0 }
        pending_message_count: { type: integer, minimum: 0 }
        estimated_index_bytes:
          description: >-
            建完之后索引大约会占多少字节。**是估算不是测量**：按「每条可检索消息
            一个常数」线性外推，常数取自真机实测（724k 条消息对应约 684 MiB 的
            trigram 与 1–2 字 gram 结构）。界面必须以「约」呈现。
          type: integer
          minimum: 0
    SearchPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, index_status, total_count, conversation_counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        next_cursor: { type: [string, "null"] }
        index_status:
          description: >-
            这一份结果能不能当真。`ready` 是完整的；`building` 是「答得出但还不全，
            索引正在建」；`unavailable` 是索引结构坏了（缺列），要人来修；
            `not_initialized` 是**这个归档从来没建过索引**（PSU-2.88 起默认如此）。
            最后这一个必须与前三个分开：它对应的 items 恒为空，而空在归档产品里
            的意思是「你没说过这句话」——不能拿它顶替「我没建索引」。
          type: string
          enum: [ready, building, unavailable, not_initialized]
        total_count:
          description: Total hits for the complete filtered result set, independent of pagination.
          type: integer
          minimum: 0
        conversation_counts:
          description: Complete hit count keyed by conversation id for the filtered result set.
          type: object
          additionalProperties:
            type: integer
            minimum: 1
    CacheCategory:
      type: string
      enum: [media, snapshots]
    CacheCleanupRequest:
      type: object
      additionalProperties: false
      required: [account_id, category]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 128 }
        category: { $ref: "#/components/schemas/CacheCategory" }
        confirm: { type: boolean, default: false }
    CacheUsage:
      type: object
      additionalProperties: false
      required: [category, item_count, size_bytes, blocked]
      properties:
        category: { $ref: "#/components/schemas/CacheCategory" }
        item_count: { type: integer, minimum: 0 }
        size_bytes: { type: integer, minimum: 0 }
        blocked: { type: boolean }
    CacheStatus:
      type: object
      additionalProperties: false
      required: [media, snapshots]
      properties:
        media: { $ref: "#/components/schemas/CacheUsage" }
        snapshots: { $ref: "#/components/schemas/CacheUsage" }
    CacheCleanupResult:
      type: object
      additionalProperties: false
      required: [category, deleted_items, freed_bytes]
      properties:
        category: { $ref: "#/components/schemas/CacheCategory" }
        deleted_items: { type: integer, minimum: 0 }
        freed_bytes: { type: integer, minimum: 0 }
    AppSettings:
      type: object
      additionalProperties: false
      required:
        [schema_version, media_cache_quota_bytes, auto_update_enabled,
         sticker_fetch_enabled, auto_sync_enabled, auto_sync_interval_minutes,
         auto_sync_include_originals, transcription_enabled,
         transcription_auto_new]
      properties:
        schema_version: { type: integer, const: 4 }
        media_cache_quota_bytes:
          type: integer
          minimum: 268435456
          maximum: 1099511627776
        auto_update_enabled: { type: boolean }
        sticker_fetch_enabled:
          type: boolean
          description: >-
            Whether stickers may be fetched from Tencent's sticker hosts.
            A sticker's bytes are stored nowhere on the local machine, so
            showing one is an outbound request and the host learns when it
            was made. Off until the user asks for it.
        auto_sync_enabled: { type: boolean }
        auto_sync_interval_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        auto_sync_include_originals: { type: boolean }
        transcription_enabled:
          type: boolean
          description: >-
            Whether voice messages may be sent to a transcription vendor.
            This is the first thing on this machine that deliberately sends
            the user's own content out, so it is off until asked for -- the
            same rule as sticker_fetch_enabled.
        transcription_auto_new:
          type: boolean
          description: >-
            Once the switch above is on, whether newly imported voice is
            transcribed as it arrives. Meaningless while the switch is off.
    TranscriptionCredentials:
      type: object
      additionalProperties: false
      description: >-
        存着的凭据的非敏感描述。**密钥本身永远不出现在这里**，SecretId 也只给
        后四位——它整串足以指认是哪个腾讯云账号。
      required: [configured, vendor, engine, secret_id_hint]
      properties:
        configured: { type: boolean }
        vendor:
          type: [string, "null"]
          description: null 仅当 configured 为 false
        engine:
          type: [string, "null"]
          description: 存下来的那一刻用的引擎，如 16k_zh_en_2.0
        secret_id_hint:
          type: [string, "null"]
          description: 形如 `AKID****3f2a`。只够认出「是不是我以为的那把」
    TranscriptionCredentialsRequest:
      type: object
      additionalProperties: false
      required: [secret_id, secret_key]
      properties:
        secret_id: { type: string, minLength: 1 }
        secret_key: { type: string, minLength: 1 }
    TranscriptionSettingsUpdateRequest:
      type: object
      additionalProperties: false
      required: [transcription_enabled, transcription_auto_new]
      properties:
        transcription_enabled: { type: boolean }
        transcription_auto_new: { type: boolean }
    # 自动同步那三个字段**不在这里**：这个请求体是全量替换，五个调用方都按位置
    # 传三个值。它们走自己的资源（`PUT /api/v1/auto-sync`），处理器把当前值原样
    # 保留，所以改主题设置不会顺手把自动同步关掉。
    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      required: [media_cache_quota_bytes, auto_update_enabled, sticker_fetch_enabled]
      properties:
        media_cache_quota_bytes:
          type: integer
          minimum: 268435456
          maximum: 1099511627776
        auto_update_enabled: { type: boolean }
        sticker_fetch_enabled: { type: boolean }
    AutoSyncCycle:
      type: object
      additionalProperties: false
      required: [account_id, import_job_id, sync_job_id]
      properties:
        account_id: { type: string }
        import_job_id: { type: [string, "null"] }
        sync_job_id: { type: [string, "null"] }
    AutoSyncLastCycle:
      type: object
      additionalProperties: false
      required:
        [started_at, finished_at, outcome, import_job_id, sync_job_id, error_code]
      properties:
        skipped_audio_count:
          type: integer
          minimum: 0
          description: 本轮因暂时取不到音频而跳过的语音转写数，不代表同步失败。
        started_at: { type: integer }
        finished_at: { type: integer }
        outcome:
          type: string
          enum: [completed, skipped, failed]
          description: >-
            `skipped` 是「让开了」：那个账号已经有同种作业在跑，本轮不建、
            也不记一次失败。
        import_job_id: { type: [string, "null"] }
        sync_job_id: { type: [string, "null"] }
        error_code: { type: [string, "null"] }
    AutoSyncStatus:
      type: object
      additionalProperties: false
      required:
        [enabled, interval_minutes, include_originals, remote_configured, state,
         next_run_at, current_cycle, last_cycle, paused_error_code,
         consecutive_failures]
      properties:
        enabled: { type: boolean }
        interval_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        include_originals: { type: boolean }
        remote_configured:
          type: boolean
          description: >-
            远端还没接入时每轮只跑导入那一半，界面照旧出现并说明——这是
            「暂时未配置」，不是「永远不可用」。
        state:
          type: string
          enum: [disabled, waiting, running, paused]
        next_run_at:
          type: [integer, "null"]
          description: 只有 `waiting` 时有值；从上一轮**结束**起算。
        current_cycle:
          oneOf:
            - { $ref: "#/components/schemas/AutoSyncCycle" }
            - { type: "null" }
        last_cycle:
          oneOf:
            - { $ref: "#/components/schemas/AutoSyncLastCycle" }
            - { type: "null" }
        paused_error_code:
          type: [string, "null"]
          description: >-
            熔断的代号。等人处理的那一类（密钥失效、远程登录失效、远端空间
            不足）用领域错误码原文；连续 3 轮失败用 `CONSECUTIVE_FAILURES`，
            它只在这里出现。认不得的代号前端原样显示，不翻成「未知错误」。
        consecutive_failures: { type: integer, minimum: 0 }
    AutoSyncUpdateRequest:
      type: object
      additionalProperties: false
      required: [enabled, interval_minutes, include_originals]
      properties:
        enabled: { type: boolean }
        interval_minutes:
          type: integer
          minimum: 5
          maximum: 1440
        include_originals: { type: boolean }
    UpdateStatus:
      type: object
      additionalProperties: false
      required:
        [configured, current_version, available_version, active_version,
         previous_version, pending_restart, checked_at, last_error_code]
      properties:
        configured: { type: boolean }
        current_version: { type: string }
        available_version: { type: [string, "null"] }
        active_version: { type: [string, "null"] }
        previous_version: { type: [string, "null"] }
        pending_restart: { type: boolean }
        checked_at: { type: [integer, "null"], minimum: 1 }
        last_error_code: { type: [string, "null"] }
        # 以下为本机自动检查协调器的进程内状态（PSU-2.222），仅在已配置更新源时出现。
        check_phase: { type: string, enum: [disabled, idle, checking] }
        last_check_attempt_at: { type: [integer, "null"] }
        last_check_trigger:
          type: [string, "null"]
          enum: [startup, schedule, enabled, focus, visible, online, manual, null]
        next_check_at: { type: [integer, "null"] }
        consecutive_check_failures: { type: integer, minimum: 0 }
        postponed_version: { type: [string, "null"] }
        postponed_until: { type: [integer, "null"], description: 同版本暂缓到期的Unix毫秒时间 }
    UpdatePostponeRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, minLength: 5, maxLength: 64, pattern: '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$' }
        until: { type: [integer, "null"], minimum: 1 }
    UpdateCheckRequest:
      type: object
      additionalProperties: false
      properties:
        trigger:
          type: string
          enum: [manual, startup, focus, visible, online]
          default: manual
    UpdateApplyRequest:
      type: object
      additionalProperties: false
      required: [version, confirm]
      properties:
        version: { type: string, minLength: 5, maxLength: 64 }
        confirm: { type: boolean }
    UpdateRollbackRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: boolean }
    SyncHealth:
      type: object
      additionalProperties: false
      required:
        [configured, overall_status, archive_id, backend_type, device_id,
         upload_cursor, download_cursor, pending_message_count,
         pending_attachment_count, retry_batch_count, conflict_count, remote_used_bytes,
         remote_blob_count, last_success_at, last_reconciled_at,
         last_recovery_verified_at, remote_service_status, object_storage_status,
         issue_codes]
      properties:
        configured: { type: boolean }
        overall_status:
          type: string
          enum: [healthy, degraded, unavailable, not_configured]
        archive_id: { type: [string, "null"] }
        backend_type: { type: [string, "null"] }
        device_id: { type: [string, "null"] }
        upload_cursor: { type: integer, minimum: 0 }
        download_cursor: { type: integer, minimum: 0 }
        pending_message_count: { type: integer, minimum: 0 }
        pending_attachment_count: { type: integer, minimum: 0 }
        retry_batch_count: { type: integer, minimum: 0 }
        conflict_count: { type: integer, minimum: 0 }
        remote_used_bytes: { type: [integer, "null"], minimum: 0 }
        remote_blob_count: { type: [integer, "null"], minimum: 0 }
        last_success_at: { type: [integer, "null"], minimum: 1 }
        last_reconciled_at: { type: [integer, "null"], minimum: 1 }
        last_recovery_verified_at: { type: [integer, "null"], minimum: 1 }
        remote_service_status:
          type: string
          enum: [healthy, degraded, unavailable, not_configured]
        object_storage_status:
          type: string
          enum: [healthy, degraded, unknown, not_configured]
        issue_codes:
          type: array
          uniqueItems: true
          items: { type: string }
        # 定时备份（PSU-2.141）。五个都可缺、可 null：null 是「这个远端答不出备份
        # 这件事」（老远端、postgres-s3 的灾备是 pgBackRest、Worker 没有文件系统），
        # **不是「没备份过」**——那是 last_backup_status == "never" 说的话。
        # 界面据此整块不出现，而不是画一个"从未备份"的红条。
        last_backup_at: { type: [integer, "null"], minimum: 1 }
        last_backup_bytes: { type: [integer, "null"], minimum: 0 }
        last_backup_status:
          type: [string, "null"]
          enum: [not_configured, never, running, success, failed, locked, null]
        backup_retention_mode: { type: [string, "null"], enum: [lifecycle, application, null] }
        backup_overdue:
          type: [boolean, "null"]
          description: >-
            连着两个周期没有成功备份，由远端自己判定。true 会进 issue_codes 的
            BACKUP_OVERDUE；未配置走 BACKUP_NOT_CONFIGURED，是另一件事。
        backup_lifecycle_covered:
          type: [boolean, "null"]
          description: >-
            最近一次成功之后桶上的过期规则是否盖住备份前缀。null = 远端不报、不适用
            或问不到；false 会进 issue_codes 的 BACKUP_LIFECYCLE_MISSING。
        # 远端写锁与后台欠账（PSU-2.102）。六个都可缺、可 null：null 是「这个远端不报」
        # （老远端、非 SQLite 后端、worker 还没数过），**不是零**——零的意思是「没有待办」。
        account_merge_pending:
          type: [integer, "null"]
          minimum: 0
          description: 远端还欠搬的账号对；null = 远端不报。
        conversation_merge_pending:
          type: [integer, "null"]
          minimum: 0
          description: 远端还欠搬的会话对；null = 远端不报。
        conversation_merge_pending_rows:
          type: [integer, "null"]
          minimum: 0
          description: 远端还欠搬的记录行数；null = 远端不报或后台 worker 还没数过。
        search_rehome_pending_rows:
          type: [integer, "null"]
          minimum: 0
          description: 搬过行、搜索索引还没跟上的记录数（远端账本）；null = 远端不报。
        writer_lock_held_ms:
          type: [integer, "null"]
          minimum: 0
          description: 远端全局写锁此刻已被握了多少毫秒，0 = 空闲；null = 远端不报。
        writer_lock_rejections_recent:
          type: [integer, "null"]
          minimum: 0
          description: 最近窗口内被远端以 REMOTE_BUSY 拒掉的写入次数；>0 会进 issue_codes 的 REMOTE_WRITE_CONTENDED。
    SyncJobRequest:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 128 }
        include_originals:
          type: boolean
          default: true
          description: >-
            是否包含原图/文件/视频那一段。它是唯一按小时计的阶段（每个附件约
            1.7 秒，延迟受限），所以能单独关掉，而不是只能整次同步一起关。
        allow_low_space:
          type: boolean
          default: false
          description: >-
            用户已经看过「远端还剩多少」并选择继续。开传前那次预检数的是整笔
            欠账，而且把别的机器已经传过的重复文件按全尺寸算了第二遍（那些字节
            会被远端认领，一个都不多占），所以它注定高估——它只负责问一句，
            不负责替人做决定。带上这个旗子就不再问，改由运行期预算边传边看，
            真到磁盘地板才停。
    ManualSyncRequest:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 128 }
    ManualSyncResult:
      type: object
      additionalProperties: false
      required:
        [status, uploaded_message_count, committed_batch_count, conflict_count,
         upload_cursor, has_more, record_model_version, stopped_error_code]
      properties:
        status:
          type: string
          enum: [idle, completed, conflict, partial]
        uploaded_message_count: { type: integer, minimum: 0 }
        committed_batch_count: { type: integer, minimum: 0 }
        conflict_count: { type: integer, minimum: 0 }
        upload_cursor: { type: integer, minimum: 0 }
        has_more: { type: boolean }
        record_model_version:
          type: integer
          minimum: 1
          description: >-
            这次运行按哪一版记录模型上传。小于本机模型（当前 2）表示远端声明了
            落后，本轮只发了瘦记录——发送者、类型、会话名都没过去，界面必须如实
            说出来，不能让读的人以为传完了。
        stopped_error_code:
          type: [string, "null"]
          description: >-
            这一轮为什么停下来，只有 status=partial 才可能有值（PSU-2.98）。
            送出过至少一批就不算失败——游标是逐批持久推进的，数据不丢——但
            「为什么停」不能跟着一起丢：界面据此把「远程忙，稍后再来」与
            「网络断了」说成两句话，而不是一律显示「同步失败」。
            值是**传输层**的码（REMOTE_BUSY / NETWORK_UNAVAILABLE /
            REMOTE_RETRYABLE / TRANSPORT_ERROR），不是 Error.code：后者把这几种
            瞬时失败压成同一个 REMOTE_UNAVAILABLE，而那正是这个字段要保住的区分。
            max_batches 用尽那种 partial 没有错误码，这里是 null。
    StorageArea:
      type: object
      additionalProperties: false
      required: [kind, label, size_bytes, managed_by, reclaimable, detail]
      properties:
        kind:
          type: string
          enum: [wechat_source, local_index, media_cache, remote_copy]
        label: { type: string }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        managed_by:
          type: string
          enum: [wechat, chat_archive, remote]
        reclaimable: { type: boolean }
        detail: { type: string }
    StorageOverview:
      type: object
      additionalProperties: false
      required:
        [areas, media_quota_bytes, media_unload_ready, media_unload_blockers,
         source_files_untouched]
      properties:
        areas:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/StorageArea" }
        media_quota_bytes: { type: integer, minimum: 268435456 }
        media_unload_ready: { type: boolean }
        media_unload_blockers:
          type: array
          uniqueItems: true
          items: { type: string }
        source_files_untouched: { type: boolean, const: true }
    StorageUnloadRequest:
      type: object
      additionalProperties: false
      required: [account_id, confirmation]
      properties:
        account_id: { type: string, minLength: 1, maxLength: 128 }
        confirmation:
          type: string
          const: UNLOAD_LOCAL_MEDIA_CACHE
    StorageUnloadResult:
      type: object
      additionalProperties: false
      required: [deleted_items, freed_bytes, source_files_untouched, local_index_untouched]
      properties:
        deleted_items: { type: integer, minimum: 0 }
        freed_bytes: { type: integer, minimum: 0 }
        source_files_untouched: { type: boolean, const: true }
        local_index_untouched: { type: boolean, const: true }
    AnalysisSummary:
      type: object
      additionalProperties: false
      required: [message_count, sent_count, received_count, active_days, conversation_count, private_count, group_count]
      properties:
        message_count: { type: integer, minimum: 0 }
        sent_count: { type: integer, minimum: 0 }
        received_count: { type: integer, minimum: 0 }
        active_days: { type: integer, minimum: 0 }
        conversation_count: { type: integer, minimum: 0 }
        private_count: { type: integer, minimum: 0 }
        group_count: { type: integer, minimum: 0 }
        unknown_direction_count:
          description: Records whose sending direction is unknown; excluded from sent and received counts.
          type: integer
          minimum: 0
    AnalysisDay:
      type: object
      additionalProperties: false
      required: [day, message_count]
      properties:
        day: { type: string, format: date }
        message_count: { type: integer, minimum: 0 }
    AnalysisHour:
      type: object
      additionalProperties: false
      required: [hour, message_count]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        message_count: { type: integer, minimum: 0 }
    AnalysisType:
      type: object
      additionalProperties: false
      required: [message_type, message_count]
      properties:
        message_type: { type: string }
        message_count: { type: integer, minimum: 0 }
    AnalysisConversation:
      type: object
      additionalProperties: false
      required: [conversation_id, display_name, is_group, message_count]
      properties:
        conversation_id: { type: string }
        display_name: { type: string }
        is_group: { type: [boolean, "null"] }
        message_count: { type: integer, minimum: 0 }
    AnalysisParticipant:
      type: object
      additionalProperties: false
      required: [sender_uid, display_name, is_self, message_count]
      properties:
        sender_uid:
          type: [string, "null"]
          description: 稳定发送者身份；本人合并项与缺失身份项为 null，使用 is_self 区分。
        display_name: { type: string }
        is_self: { type: boolean }
        message_count: { type: integer, minimum: 0 }
    AnalysisPage:
      type: object
      additionalProperties: false
      required: [date_from, date_to, timezone, summary, daily, hours, types, conversations, ranking_truncated, updated_at]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        timezone: { type: string, enum: [Asia/Shanghai] }
        summary: { $ref: "#/components/schemas/AnalysisSummary" }
        daily: { type: array, items: { $ref: "#/components/schemas/AnalysisDay" } }
        hours: { type: array, items: { $ref: "#/components/schemas/AnalysisHour" } }
        types: { type: array, items: { $ref: "#/components/schemas/AnalysisType" } }
        conversations: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AnalysisConversation" } }
        ranking_truncated: { type: boolean }
        updated_at: { type: [integer, "null"] }
        selected_conversation_is_group: { type: [boolean, "null"] }
        participants:
          type: array
          maxItems: 100
          description: 仅单个群聊范围返回，按发送者身份聚合，含本人及缺失身份项；占比使用 summary.message_count，不能推断成员互动关系。旧服务可能缺省。
          items: { $ref: "#/components/schemas/AnalysisParticipant" }
        participant_count: { type: integer, minimum: 0, description: 有发言且身份已知的成员数，包含本人，不含缺失身份项。 }
        participant_ranking_truncated: { type: boolean }
        unknown_sender_count: { type: integer, minimum: 0 }
    DailyStat:
      type: object
      additionalProperties: false
      required: [day, message_count, media_count]
      properties:
        day:
          type: string
          description: UTC 日界的 YYYY-MM-DD
        message_count: { type: integer, minimum: 0 }
        media_count: { type: integer, minimum: 0 }
    DailyStatsPage:
      type: object
      additionalProperties: false
      required: [items, updated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DailyStat" }
        updated_at:
          type: [integer, "null"]
          description: 所选范围内物化行的最近更新时间；无数据为 null
    ConversationStat:
      type: object
      additionalProperties: false
      required:
        [conversation_id, display_name, message_count, media_count,
         first_message_at, last_message_at]
      properties:
        conversation_id: { type: string }
        display_name: { type: string }
        message_count: { type: integer, minimum: 0 }
        media_count: { type: integer, minimum: 0 }
        first_message_at: { type: integer }
        last_message_at: { type: integer }
    ConversationStatsPage:
      type: object
      additionalProperties: false
      required: [items, updated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationStat" }
        updated_at:
          type: [integer, "null"]
          description: 全时段累计物化行的最近更新时间；无数据为 null
    AttachmentSummary:
      type: object
      additionalProperties: false
      required:
        [id, message_id, kind, file_name, mime_type, size, cache_status,
         failure_code, attempt_count, content_available, variant]
      properties:
        id: { type: string }
        message_id: { type: string }
        kind: { type: string, enum: [image, emoji, audio, video, file, unknown] }
        file_name: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        duration_ms:
          type: [integer, "null"]
          minimum: 0
          description: Voice duration from the source message metadata, in milliseconds; null when unavailable.
        cache_status:
          type: string
          enum:
            [discovered, locating, decrypting, transcoding, ready,
             source_missing, unsupported, failed, evicted]
        failure_code: { type: [string, "null"] }
        attempt_count: { type: integer, minimum: 0 }
        # 本机能不能取到内容，不是「缓存里有没有」。缓存被配额淘汰后只要源文件还在，
        # 取内容时会现解一份，所以 evicted/discovered 且仍有源引用的附件也为 true。
        # 这是乐观值：源引用存在不代表源文件还在。取内容那一步若发现源头也没了，
        # 会把该行标成 source_missing，随后的响应就不再承诺它。
        content_available: { type: boolean }
        # Which stored variant of the source was served. `thumbnail` means the
        # full-size source could not be decoded and a lower-resolution sibling
        # stood in for it -- clients must label that rather than present it as
        # the original. `null` when the kind has no variants, or when the row
        # predates variant-aware resolution and has not been re-resolved.
        variant:
          type: [string, "null"]
          enum: [hd, original, thumbnail, null]
    FeedbackAttachment:
      type: object
      additionalProperties: false
      required: [name, type, size, data_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 260 }
        # 照抄上游的实际口径（share-worker.js 的 normalizeFeedbackCommentAttachments）：
        # image/*、video/*，以及 application/json——**操作回放（rrweb 事件）就是以
        # 后者的形态走附件的**（feedback-rrweb-<ts>.json）。比上游更严没有好处：
        # 被这里挡下的东西上游本来会收。
        # **用户截的图、录的屏与回放可能整屏都是聊天内容**，所以这一条是格式约束
        # 而非安全约束：真正的把关是提交前用户自己看得见预览与前端的脱敏。
        type:
          type: string
          pattern: "^(image|video)/[A-Za-z0-9.+_-]{1,64}$|^application/json$"
        # 调用方声明的字节数。后端**不信它**：转发前用解码后量到的真值覆盖掉
        # （上游会拿两者对账，对不上整条拒收）。
        size: { type: integer, minimum: 0, maximum: 4194304 }
        # base64 data URL。上限是 4 MiB 解码后的字节数换算成 base64 的长度。
        # `data:` 里的 mime 必须与上面的 `type` 逐字相同——上游对不上就整条拒收。
        data_url: { type: string, minLength: 1, maxLength: 5592500 }
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [description, submitted_type]
      properties:
        # 可选，而且界面不再编一个：标题由上游平台生成（入库先落占位，AI 读完
        # 正文再回写）。上游的提交载荷里连 `title` 这个键都不出现，就是为了不让
        # 谁顺手填上它而让占位被跳过。字段本身留着，是为了不把还没升级、仍然
        # 自己拟标题的调用方 400 掉；给了就原样转发。
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        # 空串＝不留联系方式。留了就会随反馈一起离开这台机器，界面须说清这点。
        contact: { type: string, maxLength: 240 }
        submitted_type: { type: string, enum: [bug, improvement, question, unclear] }
        source_type: { type: string, const: manual }
        # maxItems 由上游定：share-worker.js 的 MAX_FEEDBACK_COMMENT_ATTACHMENTS
        # 是 5，第 6 个会被 FEEDBACK_ATTACHMENTS_TOO_MANY 拒收。
        attachments:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/FeedbackAttachment" }
        # 出问题的那个页面的地址，**已经由前端脱敏过**（查询串与路径里的标识
        # 在离开页面之前就被抹掉了）。后端原样转发成上游的 `pageUrl`，不解释也
        # 不再洗第二遍——洗两遍只会让两处规则慢慢对不上，而谁都说不清最终发出去
        # 的是哪一份。与 `context` 同级同待遇：一个字都不进日志（脱敏之后它仍然
        # 可能带着路径或用户名）。
        page_url: { type: string, maxLength: 2048 }
        # 浏览器标识（`navigator.userAgent`），原样转发成上游的 `userAgent`，给
        # 「只在某个内核上复现」这类反馈一个能对上的事实。同样一个字都不进日志。
        user_agent: { type: string, maxLength: 512 }
        # 随反馈一起走的结构化上下文（当前路由、应用版本、可选的操作回放……）。
        # 形状由界面决定，后端**原样转发不解释**——它是这条链路上唯一可能夹带
        # 聊天内容的地方，所以它同样一个字都不进日志。
        context:
          type: object
          additionalProperties: true
    FeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, owner_url]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        owner_url: { type: string, format: uri, maxLength: 2048 }
    FeedbackRejection:
      type: object
      additionalProperties: false
      required: [error, upstream]
      properties:
        # 与其它端点逐字节同形，前端那套错误处理原样适用。
        error: { $ref: "#/components/schemas/PublicError" }
        upstream:
          type: object
          additionalProperties: false
          required: [error, patterns]
          properties:
            error: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
            # 命中的隐私模式**名字**（`wxid`、`phone`），不是命中的那段文字。
            # 后端按同一条字符集白名单过一遍才透传：上游若把用户填的内容塞进
            # 这里，它到不了界面，也到不了日志。
            patterns:
              type: array
              maxItems: 32
              items: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.-]+$" }
    FeedbackContactRequest:
      type: object
      required: [contact]
      properties:
        contact: { type: string }
    FeedbackContactAnswer:
      # 平台那份响应体过白名单之后的样子（`feedback.py` 的 `_contact_document`）。
      # 成功时是前三个键，失败时是后两个；本机不补任何一个缺席的键。
      type: object
      additionalProperties: false
      properties:
        saved: { type: boolean }
        contactType: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
        version: { type: integer }
        error: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
        patterns:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.-]+$" }
    FeedbackWidgetConfig:
      # **故意是自由对象**。这份文档的形状由平台的
      # `serializeFeedbackWidgetConfig` 说了算（今天是 `projectId`、
      # `widgetVersion`、`limits`、`privacy`），本仓只做同源转发，一个字段都不
      # 解释、不重排、不补默认值。
      #
      # 把它写成固定字段的代价：平台加一个键（比如某天给某个项目加 `copy`
      # 覆盖），这份契约就落后一版，而落后的症状是**校验把新键丢掉**——widget
      # 拿到一份被本仓悄悄削过的配置，跑的脱敏规则与平台那张表不一样，且没有
      # 任何一处会报错。真正解释它的是 widget 的 `resolveWidgetConfig`，它对
      # 缺字段、多字段、坏正则已经各有一套处理。
      type: object
      additionalProperties: true
    PublicError:
      # 抽成具名 schema 只是为了能被第二处引用（`FeedbackRejection`），字段与
      # 约束一个都没动——`Error` 的 `additionalProperties: false` 让它无法用
      # allOf 扩展，而把这一段抄第二遍是契约里最容易分叉的那种重复。
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        recommended_action:
          type: [string, "null"]
          enum: [close_wechat, reselect_source, retry, check_disk_space, null]
        job_id:
          type: [string, "null"]
          pattern: "^job_[A-Za-z0-9_-]{8,64}$"
        details_ref:
          type: [string, "null"]
          pattern: "^diag_[A-Za-z0-9_-]{8,64}$"
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/PublicError" }
