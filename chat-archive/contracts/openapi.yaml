      description: >-
        在微信中清理已备份的记录之前的就绪度（PSU-2.186）：这个会话从最早到哪一天已全部同步到远端、
        按「保留最近」算出的建议结束日期、还没同步的与同步治不了的各有多少、同步现在跑不跑得动。
        只看微信清理页能清的图片 / 视频 / 文件与文字消息。仅本机端（能力 wechat-cleanup）。
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
