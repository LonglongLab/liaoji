          description: >-
            会话名称过滤；LIKE 通配符按字面处理。匹配会话名、联系人名与备注，
            以及群成员的名字。

            名字这几列按**子序列**匹配（PSU-2.74）：查询里的每个字按顺序出现即可，
            所以「示软」找得到「示例软件」。群成员那一支仍是子串——它是一条相关
            子查询，放宽等于为每个会话多扫一遍成员表。输入超过 16 个字时整体退回
            子串：名录里搜的是名字，而几百个通配符的回溯不是名录该付的钱。

            结果先按**匹配得有多准**分档（前缀 / 子串 / 只有子序列），再按最近
